document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"ru\"><head>\n<meta charset=\"utf-8\">\n<title>EmplyFlow · Buklet · 100×200 · 2 стр.<\u002Ftitle>\n\n<style>/* =============================================================\n   EmplyFlow / ЭмплиФлоу — Foundational Tokens\n   Colors, Typography, Spacing, Radii, Shadows\n   ============================================================= */\n\n/* Manrope — official EmplyFlow brand font (locally hosted) */\n@font-face { font-family: 'Manrope'; src: url(\"cbd2033a-0408-4e9b-8454-6581465b54ab\") format('truetype'); font-weight: 200; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"59606fa4-fa62-4bad-8f33-24d5766f2c6f\")      format('truetype'); font-weight: 300; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"7a1f9b91-4daa-4070-af0a-5ffe246b1de5\")    format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"faf343fe-452a-461c-a683-2a4d4632383a\")     format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"ac1e98a6-a519-4e4c-9a66-c53d88aea773\")   format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"6552e3a6-07e2-44d9-a926-d52a1cfdf2bb\")       format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"a2b14864-53d5-468b-ab3c-ddf7a2e58a8e\")  format('truetype'); font-weight: 800; font-style: normal; font-display: swap; }\n\n:root {\n  /* ---- BRAND PALETTE -------------------------------------------------\n     Names match the official site-palette SVG.\n     Roles: Black Rock + Blue Ribbon are the workhorses.\n     The four pastels rotate as \"tile\" colors for cards/sections.\n     Cotton Candy is the accent highlight for callouts. */\n\n  --c-black-rock: #050230;         /* Deep navy — primary background */\n  --c-black-rock-2: #0a0540;       /* Slightly lifted */\n  --c-blue-ribbon: #4a3bff;        /* Primary action / brand indigo */\n  --c-blue-ribbon-deep: #3a2cf0;\n  --c-cotton-candy: #ffb8e2;       /* Pink accent — highlight text, dashed callouts */\n  --c-periwinkle: #cec8ff;         /* Lavender tile */\n  --c-fog: #d9d6ff;                /* Lighter lavender — surfaces, secondary text on dark */\n  --c-frosted-mint: #d5fff3;       /* Mint tile / brand-name highlight */\n  --c-mac-cheese: #ffb777;         /* Soft orange CTA + tile */\n  --c-cod-gray: #151515;           /* Near-black for dark-on-pastel */\n  --c-black: #000000;\n  --c-white: #ffffff;\n\n  /* ---- SEMANTIC SURFACES (dark theme, the brand default) ---------- */\n  --bg: var(--c-black-rock);\n  --bg-elevated: #0d0848;\n  --bg-glass: rgba(217, 214, 255, 0.06);\n  --bg-glass-strong: rgba(217, 214, 255, 0.10);\n\n  /* ---- SEMANTIC FOREGROUNDS --------------------------------------- */\n  --fg1: var(--c-white);           /* Primary text on dark */\n  --fg2: rgba(255, 255, 255, 0.72);/* Secondary */\n  --fg3: rgba(255, 255, 255, 0.48);/* Tertiary, captions */\n  --fg-mute: rgba(217, 214, 255, 0.32);\n\n  --fg-on-light: var(--c-cod-gray);\n  --fg-on-light-2: rgba(21, 21, 21, 0.66);\n\n  --fg-accent: var(--c-cotton-candy);\n  --fg-brand: var(--c-blue-ribbon);\n\n  /* ---- STROKES ----------------------------------------------------- */\n  --stroke: rgba(217, 214, 255, 0.12);\n  --stroke-strong: rgba(217, 214, 255, 0.22);\n  --stroke-dashed-accent: var(--c-cotton-candy);\n\n  /* ---- TYPE FAMILIES ---------------------------------------------- */\n  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;\n  --font-display: 'Manrope', system-ui, sans-serif;\n  --font-mono: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;\n\n  /* ---- TYPE SCALE (1920 baseline; scales fine via clamp on web) --- */\n  --fs-hero:   clamp(56px, 7vw, 128px);  /* Massive brand title \"ЭмплиФлоу\" */\n  --fs-h1:     clamp(40px, 4.5vw, 76px); /* Section heroes */\n  --fs-h2:     clamp(32px, 3vw, 52px);   /* Card titles, big stats */\n  --fs-h3:     clamp(22px, 1.6vw, 28px); /* Sub-headings */\n  --fs-h4:     20px;\n  --fs-body-l: 20px;\n  --fs-body:   17px;\n  --fs-body-s: 15px;\n  --fs-caption:13px;\n  --fs-eyebrow:12px;\n\n  /* ---- LINE HEIGHT / TRACKING ------------------------------------- */\n  --lh-tight: 1.02;\n  --lh-snug:  1.12;\n  --lh-base:  1.45;\n  --lh-loose: 1.6;\n\n  --tr-tight: -0.02em;\n  --tr-base:   0em;\n  --tr-eyebrow: 0.12em;\n\n  --fw-light: 300;\n  --fw-reg: 400;\n  --fw-med: 500;\n  --fw-semi: 600;\n  --fw-bold: 700;\n  --fw-black: 800;\n\n  /* ---- SPACING SCALE (4px base) ----------------------------------- */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 24px;\n  --s-6: 32px;\n  --s-7: 48px;\n  --s-8: 64px;\n  --s-9: 96px;\n  --s-10: 128px;\n\n  /* ---- RADII — rounded but tactile -------------------------------- */\n  --r-xs: 8px;\n  --r-sm: 14px;\n  --r-md: 20px;\n  --r-lg: 28px;\n  --r-xl: 40px;\n  --r-2xl: 56px;\n  --r-pill: 999px;\n\n  /* ---- SHADOWS ----------------------------------------------------- */\n  --shadow-card: 0 2px 0 rgba(0,0,0,0.04), 0 24px 60px -20px rgba(5,2,48,0.55);\n  --shadow-glow-indigo: 0 0 80px -10px rgba(74,59,255,0.55);\n  --shadow-glow-pink:   0 0 80px -10px rgba(255,184,226,0.45);\n\n  /* ---- MOTION ------------------------------------------------------ */\n  --ease-out: cubic-bezier(.2,.7,.2,1);\n  --ease-in-out: cubic-bezier(.7,0,.2,1);\n  --t-fast: 150ms;\n  --t-base: 240ms;\n  --t-slow: 420ms;\n}\n\n/* =============================================================\n   SEMANTIC CLASSES — drop on elements directly\n   ============================================================= */\n\nhtml, body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-base);\n  color: var(--fg1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n.h-hero {\n  font-family: var(--font-display);\n  font-size: var(--fs-hero);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.03em;\n}\n.h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n}\n.h2 {\n  font-size: var(--fs-h2);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n}\n.h3 {\n  font-size: var(--fs-h3);\n  font-weight: var(--fw-semi);\n  line-height: 1.25;\n}\n.h4 { font-size: var(--fs-h4); font-weight: var(--fw-semi); }\n\n.body-l { font-size: var(--fs-body-l); line-height: var(--lh-base); }\n.body   { font-size: var(--fs-body);   line-height: var(--lh-base); }\n.body-s { font-size: var(--fs-body-s); line-height: var(--lh-base); }\n\n.caption {\n  font-size: var(--fs-caption);\n  color: var(--fg3);\n  line-height: 1.4;\n}\n.eyebrow {\n  font-size: var(--fs-eyebrow);\n  letter-spacing: var(--tr-eyebrow);\n  text-transform: uppercase;\n  font-weight: var(--fw-semi);\n  color: var(--fg2);\n}\n\n.t-mint   { color: var(--c-frosted-mint); }\n.t-pink   { color: var(--c-cotton-candy); }\n.t-indigo { color: var(--c-blue-ribbon); }\n.t-fog    { color: var(--c-fog); }\n.t-orange { color: var(--c-mac-cheese); }\n<\u002Fstyle>\n<style>\n  /* ============================================================\n     BOOKLET / FLYER · 100×200 mm · 2 pages (front + back)\n     Bleed 5 mm  →  page box 110×210 mm\n     Safe zone 90×190 mm (content inset 10 mm from bleed edge)\n     ============================================================ */\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { background: #1a1438; font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }\n\n  .stage {\n    min-height: 100vh; padding: 28px;\n    display: flex; flex-wrap: wrap; gap: 28px;\n    align-items: flex-start; justify-content: center;\n  }\n\n  /* ---- the physical page (bleed box) ---- */\n  .page {\n    width: 110mm;\n    height: 210mm;\n    background: #050230;\n    color: #fff;\n    position: relative;\n    overflow: hidden;\n    box-shadow: 0 24px 70px -20px rgba(0,0,0,.7);\n  }\n  /* content lives inside the safe zone: 10mm in from the bleed edge */\n  .safe {\n    position: absolute;\n    inset: 10mm;\n    z-index: 3;\n    display: flex;\n    flex-direction: column;\n  }\n\n  /* on-screen guides (hidden in print) */\n  .guide { position: absolute; pointer-events: none; z-index: 9; }\n  .guide.trim { inset: 5mm;  border: 0.3mm dashed rgba(255,184,226,.55); }\n  .guide.safe { inset: 10mm; border: 0.3mm dashed rgba(213,255,243,.40); }\n  .page-tag {\n    position: absolute; top: -22px; left: 0; z-index: 20;\n    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;\n    color: rgba(255,255,255,.55); font-family: ui-monospace, monospace;\n  }\n\n  /* ---- ambient background ---- */\n  .bg-bloom {\n    position: absolute; inset: 0; pointer-events: none; z-index: 1;\n    background:\n      radial-gradient(48% 26% at 80% 6%,  rgba(74, 59, 255, 0.55) 0%, transparent 70%),\n      radial-gradient(42% 22% at 6% 42%,  rgba(255, 184, 226, 0.20) 0%, transparent 70%),\n      radial-gradient(52% 18% at 50% 92%, rgba(74, 59, 255, 0.30) 0%, transparent 70%);\n  }\n  .bg-grain {\n    position: absolute; inset: 0; opacity: .3; pointer-events: none; z-index: 2; mix-blend-mode: overlay;\n    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px);\n  }\n  .spark { position: absolute; pointer-events: none; z-index: 4; }\n\n  /* ============ shared type ============ */\n  .brand-row { display: flex; justify-content: space-between; align-items: center; }\n  .brand { font-weight: 800; font-size: 15pt; letter-spacing: -0.03em; line-height: 1; }\n  .brand-meta { font-size: 6pt; color: rgba(255,255,255,.55); letter-spacing: .14em; text-transform: uppercase; }\n\n  .eyebrow {\n    display: inline-flex; align-items: center; gap: 7px;\n    font-size: 6.5pt; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;\n    color: #d5fff3;\n  }\n  .eyebrow .dot { width: 5px; height: 5px; border-radius: 999px; background: #d5fff3; box-shadow: 0 0 8px #d5fff3; }\n\n  /* ============ FRONT PAGE ============ */\n  .f-headline {\n    font-weight: 800; font-size: 23pt; line-height: 1.0; letter-spacing: -0.04em;\n    margin-top: 7mm;\n  }\n  .f-headline .mint { color: #d5fff3; }\n  .f-headline .ai-wrap {\n    display: inline-block; padding: 0.4mm 4mm 1mm;\n    border: 0.7mm dashed #ffb8e2; border-radius: 999px;\n    color: #fff; white-space: nowrap;\n  }\n  .f-sub {\n    margin-top: 5mm; font-size: 8.5pt; line-height: 1.42;\n    color: rgba(255,255,255,.78); font-weight: 400;\n  }\n\n  /* dashboard mockup */\n  .dash-wrap { margin-top: 7mm; transform: rotate(-2.2deg); filter: drop-shadow(0 6mm 10mm rgba(74,59,255,0.45)); }\n  .dash {\n    background: linear-gradient(180deg, #f6f4ff 0%, #ffffff 100%);\n    border-radius: 4mm; padding: 3mm;\n    box-shadow: inset 0 0 0 0.3mm rgba(0,0,0,.04);\n    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2.4mm;\n  }\n  .dash .panel { background: #f3f1ff; border-radius: 2.6mm; padding: 2.4mm; }\n  .dash .person { display: flex; gap: 2mm; align-items: center; margin-bottom: 2mm; }\n  .dash .ava { width: 7mm; height: 7mm; border-radius: 999px; background: linear-gradient(135deg, #ffb8e2, #cec8ff); flex: none; }\n  .dash .name { font-size: 6pt; color: #050230; font-weight: 700; line-height: 1.1; }\n  .dash .role { font-size: 4.6pt; color: rgba(5,2,48,.55); }\n  .dash .pill { display: inline-block; padding: 0.8mm 2mm; border-radius: 999px; background: #d5fff3; color: #050230; font-size: 4.6pt; font-weight: 700; margin-bottom: 1.6mm; }\n  .dash .row { display: flex; justify-content: space-between; font-size: 5.2pt; color: rgba(5,2,48,.7); padding: 0.8mm 0; border-bottom: 0.2mm solid rgba(5,2,48,.06); }\n  .dash .row:last-child { border: 0; }\n  .dash .row b { color: #050230; font-weight: 700; }\n  .dash .label { font-size: 5.4pt; color: #050230; font-weight: 700; margin-bottom: 1.6mm; display: flex; justify-content: space-between; align-items: center; }\n  .dash .ai-tag { font-size: 4.4pt; padding: 0.5mm 1.6mm; background: #050230; color: #fff; border-radius: 999px; letter-spacing: .08em; }\n  .dash .chart { display: flex; align-items: flex-end; gap: 1.4mm; height: 15mm; padding: 1mm 0; }\n  .dash .bar { flex: 1; background: linear-gradient(180deg, #4a3bff, #cec8ff); border-radius: 1mm; }\n  .dash .ring-wrap { display: flex; align-items: center; gap: 2mm; margin-top: 1.6mm; }\n  .dash .ring { width: 11mm; height: 11mm; border-radius: 999px; background: conic-gradient(#4a3bff 0 78%, #e6e3ff 78% 100%); display: grid; place-items: center; position: relative; flex: none; }\n  .dash .ring::before { content: \"\"; width: 7mm; height: 7mm; border-radius: 999px; background: #f3f1ff; position: absolute; }\n  .dash .ring span { position: relative; font-size: 5.4pt; font-weight: 700; color: #050230; }\n  .dash .ai-rec { font-size: 5pt; line-height: 1.4; margin-top: 1.6mm; }\n\n  /* value cards row */\n  .values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.6mm; margin-top: auto; }\n  .v-card {\n    border-radius: 4mm; padding: 3.4mm; color: #050230;\n    min-height: 34mm; display: flex; flex-direction: column; justify-content: space-between;\n  }\n  .v-card.is-dark { color: #fff; }\n  .v-icon { width: 9mm; height: 9mm; border-radius: 2.6mm; background: rgba(5,2,48,.10); display: grid; place-items: center; }\n  .v-card.is-dark .v-icon { background: rgba(255,255,255,.18); }\n  .v-icon svg { width: 5mm; height: 5mm; }\n  .v-card h3 { font-size: 9pt; font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; margin-top: 2.6mm; }\n\n  /* ============ BACK PAGE ============ */\n  .b-head { display: flex; justify-content: space-between; align-items: flex-end; }\n  .m-title { font-weight: 800; font-size: 17pt; letter-spacing: -0.035em; line-height: 0.98; }\n  .m-title .accent { color: #d5fff3; }\n  .m-sub { font-size: 6.4pt; color: rgba(255,255,255,.55); max-width: 34mm; text-align: right; }\n\n  .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.6mm; margin-top: 4mm; }\n  .m-card {\n    background: rgba(217,214,255,0.06);\n    border: 0.3mm solid rgba(217,214,255,0.18);\n    border-radius: 3.4mm; padding: 3mm; position: relative; overflow: hidden;\n  }\n  .m-card.glow::before { content: \"\"; position: absolute; inset: -8mm; pointer-events: none; background: radial-gradient(40% 60% at 80% 0%, rgba(74,59,255,0.35) 0%, transparent 60%); }\n  .m-icon { width: 8mm; height: 8mm; border-radius: 2.2mm; background: #050230; border: 0.3mm solid rgba(217,214,255,.25); display: grid; place-items: center; color: #d5fff3; margin-bottom: 2mm; position: relative; }\n  .m-card.is-ai .m-icon { background: linear-gradient(135deg, #4a3bff, #ffb8e2); border-color: transparent; color: #fff; box-shadow: 0 0 4mm rgba(74,59,255,.6); }\n  .m-icon svg { width: 4.6mm; height: 4.6mm; }\n  .m-card h4 { font-size: 8.5pt; font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; }\n  .m-card p { font-size: 5.6pt; color: rgba(255,255,255,.65); line-height: 1.4; margin-top: 1.4mm; }\n  .m-ai-pill { position: absolute; top: 2.4mm; right: 2.4mm; font-size: 4.6pt; font-weight: 700; padding: 0.6mm 1.6mm; background: #ffb8e2; color: #050230; border-radius: 999px; letter-spacing: .1em; }\n\n  /* logos */\n  .social { margin-top: 5mm; }\n  .lbl { font-size: 6pt; color: rgba(255,255,255,.55); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 2.4mm; }\n  .logos { display: flex; gap: 2.4mm; }\n  .logo-chip { flex: 1; background: #fff; border-radius: 3mm; height: 13mm; display: flex; align-items: center; justify-content: center; padding: 2mm 3mm; }\n  .logo-chip img { max-height: 8mm; max-width: 100%; object-fit: contain; display: block; }\n  .logo-chip.glow-indigo { box-shadow: 0 0 7mm -1mm rgba(74,59,255,0.70), 0 0 3mm rgba(74,59,255,0.30); }\n  .logo-chip.glow-pink   { box-shadow: 0 0 7mm -1mm rgba(255,184,226,0.70), 0 0 3mm rgba(255,184,226,0.30); }\n  .logo-chip.glow-mint   { box-shadow: 0 0 7mm -1mm rgba(213,255,243,0.70), 0 0 3mm rgba(213,255,243,0.30); }\n\n  /* CTA + QR */\n  .cta { margin-top: auto; }\n  .cta-row { display: flex; gap: 4mm; align-items: center; }\n  .cta-text { flex: 1; font-weight: 800; font-size: 16pt; line-height: 0.98; letter-spacing: -0.035em; }\n  .cta-text .demo { color: #ffb777; }\n  .cta-sub { margin-top: 2mm; font-size: 7pt; color: rgba(255,255,255,.7); }\n  .qr { width: 26mm; height: 26mm; background: #fff; border-radius: 3.4mm; padding: 2mm; flex: none; box-shadow: 0 4mm 10mm rgba(0,0,0,.5); }\n  .qr img { width: 100%; height: 100%; display: block; }\n  .qr-label { text-align: center; margin-top: 1.4mm; font-size: 5.4pt; color: rgba(255,255,255,.7); letter-spacing: .1em; text-transform: uppercase; }\n\n  .contacts {\n    margin-top: 4mm; padding-top: 2.6mm; border-top: 0.3mm solid rgba(217,214,255,.16);\n    display: flex; justify-content: space-between; align-items: center; font-size: 7pt; color: #fff;\n  }\n  .contacts .em { color: #d5fff3; font-weight: 600; }\n\n  /* ============ PRINT ============ */\n  @media print {\n    @page { size: 110mm 210mm; margin: 0; }\n    html, body { margin: 0 !important; padding: 0 !important; background: #050230 !important;\n      -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact; }\n    .stage { display: block !important; padding: 0 !important; margin: 0 !important; min-height: 0 !important; }\n    .guide, .page-tag { display: none !important; }\n    .page {\n      width: 110mm !important; height: 210mm !important;\n      margin: 0 !important; box-shadow: none !important;\n      break-after: page; page-break-after: always;\n      break-inside: avoid; page-break-inside: avoid;\n    }\n    .page:last-child { break-after: auto; page-break-after: auto; }\n    .page * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"stage\">\n\n  <!-- ===================== PAGE 1 · FRONT ===================== -->\n  <div class=\"page\" data-screen-label=\"Buklet · стр. 1 (лицо)\">\n    <span class=\"page-tag\">Стр. 1 · лицо · 110×210 mm (bleed)<\u002Fspan>\n    <div class=\"bg-bloom\"><\u002Fdiv>\n    <div class=\"bg-grain\"><\u002Fdiv>\n\n    <svg class=\"spark\" style=\"top:14mm; right:14mm\" width=\"9mm\" height=\"9mm\" viewBox=\"0 0 24 24\" fill=\"#ffb8e2\"><path d=\"M12 0L13.5 10.5 24 12 13.5 13.5 12 24 10.5 13.5 0 12 10.5 10.5z\"><\u002Fpath><\u002Fsvg>\n    <svg class=\"spark\" style=\"top:74mm; left:8mm\" width=\"6mm\" height=\"6mm\" viewBox=\"0 0 24 24\" fill=\"#d5fff3\"><path d=\"M12 0L13.5 10.5 24 12 13.5 13.5 12 24 10.5 13.5 0 12 10.5 10.5z\"><\u002Fpath><\u002Fsvg>\n\n    <div class=\"safe\">\n      <div class=\"brand-row\">\n        <div class=\"brand\">ЭмплиФлоу<\u002Fdiv>\n        <div class=\"brand-meta\">HR · Performance · AI<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:8mm\">\n        <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>HR-Tech · AI на каждом шаге<\u002Fdiv>\n        <h1 class=\"f-headline\">\n          HR-платформа<br>\n          с <span class=\"ai-wrap\">AI-ассистентами<\u002Fspan><br>\n          для <span class=\"mint\">оценки<\u002Fspan>, развития<br>\n          и Performance Review\n        <\u002Fh1>\n        <p class=\"f-sub\">\n          Автоматизируем HR-процессы, снижаем нагрузку на команду и помогаем принимать решения быстрее — на основе данных, а не интуиции.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <!-- dashboard mockup -->\n      <div class=\"dash-wrap\">\n        <div class=\"dash\">\n          <div class=\"panel\">\n            <div class=\"person\">\n              <div class=\"ava\"><\u002Fdiv>\n              <div>\n                <div class=\"name\">Анна Петрова<\u002Fdiv>\n                <div class=\"role\">Product Manager · L4<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"pill\">HiPo · Резерв<\u002Fdiv>\n            <div class=\"row\"><span>Цели Q4<\u002Fspan><b>92%<\u002Fb><\u002Fdiv>\n            <div class=\"row\"><span>Performance<\u002Fspan><b>4.6 / 5<\u002Fb><\u002Fdiv>\n            <div class=\"row\"><span>360°<\u002Fspan><b>4.8<\u002Fb><\u002Fdiv>\n            <div class=\"row\"><span>Потенциал<\u002Fspan><b style=\"color:#4a3bff\">A+<\u002Fb><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"panel\">\n            <div class=\"label\"><span>Эффективность<\u002Fspan><span class=\"ai-tag\">AI<\u002Fspan><\u002Fdiv>\n            <div class=\"chart\">\n              <div class=\"bar\" style=\"height:40%\"><\u002Fdiv>\n              <div class=\"bar\" style=\"height:62%\"><\u002Fdiv>\n              <div class=\"bar\" style=\"height:48%\"><\u002Fdiv>\n              <div class=\"bar\" style=\"height:80%\"><\u002Fdiv>\n              <div class=\"bar\" style=\"height:70%\"><\u002Fdiv>\n              <div class=\"bar\" style=\"height:92%\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"ring-wrap\">\n              <div class=\"ring\"><span>78%<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:5pt; color:#050230\"><b>OKR<\u002Fb><br><span style=\"color:rgba(5,2,48,.6)\">+12% к Q3<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"panel\" style=\"background:#050230; color:#fff\">\n            <div class=\"label\" style=\"color:#fff\"><span>AI рекомендации<\u002Fspan><span class=\"ai-tag\" style=\"background:#ffb8e2;color:#050230\">★<\u002Fspan><\u002Fdiv>\n            <div class=\"ai-rec\" style=\"color:rgba(255,255,255,.85)\">\n              → ИПР по <b style=\"color:#d5fff3\">у
