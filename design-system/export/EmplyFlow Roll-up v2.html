  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"ru\"><head>\n<meta charset=\"utf-8\">\n<title>EmplyFlow · Roll-up v2 · HR Conference<\u002Ftitle>\n\n<style>/* =============================================================\n   EmplyFlow / ЭмплиФлоу — Foundational Tokens\n   Colors, Typography, Spacing, Radii, Shadows\n   ============================================================= */\n\n/* Manrope — official EmplyFlow brand font (locally hosted) */\n@font-face { font-family: 'Manrope'; src: url(\"b242fc11-c110-4b8e-a674-2cc8ef06d7da\") format('truetype'); font-weight: 200; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"3c32fa2f-f91e-4fc3-9dec-27739b7d725c\")      format('truetype'); font-weight: 300; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"d5cc2aca-458c-4ba4-8a5b-da20d4ae30d1\")    format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"a4bac831-fb12-4295-98f4-5e4fbaeb616e\")     format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"78e4c224-6a9c-4c8a-b581-729544fc92d1\")   format('truetype'); font-weight: 600; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"8d0860c8-d326-4946-8d3d-bee016ae7c74\")       format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Manrope'; src: url(\"f4c0658e-d5b9-4be2-8c25-5d3dcc74abb6\")  format('truetype'); font-weight: 800; font-style: normal; font-display: swap; }\n\n:root {\n  /* ---- BRAND PALETTE -------------------------------------------------\n     Names match the official site-palette SVG.\n     Roles: Black Rock + Blue Ribbon are the workhorses.\n     The four pastels rotate as \"tile\" colors for cards/sections.\n     Cotton Candy is the accent highlight for callouts. */\n\n  --c-black-rock: #050230;         /* Deep navy — primary background */\n  --c-black-rock-2: #0a0540;       /* Slightly lifted */\n  --c-blue-ribbon: #4a3bff;        /* Primary action / brand indigo */\n  --c-blue-ribbon-deep: #3a2cf0;\n  --c-cotton-candy: #ffb8e2;       /* Pink accent — highlight text, dashed callouts */\n  --c-periwinkle: #cec8ff;         /* Lavender tile */\n  --c-fog: #d9d6ff;                /* Lighter lavender — surfaces, secondary text on dark */\n  --c-frosted-mint: #d5fff3;       /* Mint tile / brand-name highlight */\n  --c-mac-cheese: #ffb777;         /* Soft orange CTA + tile */\n  --c-cod-gray: #151515;           /* Near-black for dark-on-pastel */\n  --c-black: #000000;\n  --c-white: #ffffff;\n\n  /* ---- SEMANTIC SURFACES (dark theme, the brand default) ---------- */\n  --bg: var(--c-black-rock);\n  --bg-elevated: #0d0848;\n  --bg-glass: rgba(217, 214, 255, 0.06);\n  --bg-glass-strong: rgba(217, 214, 255, 0.10);\n\n  /* ---- SEMANTIC FOREGROUNDS --------------------------------------- */\n  --fg1: var(--c-white);           /* Primary text on dark */\n  --fg2: rgba(255, 255, 255, 0.72);/* Secondary */\n  --fg3: rgba(255, 255, 255, 0.48);/* Tertiary, captions */\n  --fg-mute: rgba(217, 214, 255, 0.32);\n\n  --fg-on-light: var(--c-cod-gray);\n  --fg-on-light-2: rgba(21, 21, 21, 0.66);\n\n  --fg-accent: var(--c-cotton-candy);\n  --fg-brand: var(--c-blue-ribbon);\n\n  /* ---- STROKES ----------------------------------------------------- */\n  --stroke: rgba(217, 214, 255, 0.12);\n  --stroke-strong: rgba(217, 214, 255, 0.22);\n  --stroke-dashed-accent: var(--c-cotton-candy);\n\n  /* ---- TYPE FAMILIES ---------------------------------------------- */\n  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;\n  --font-display: 'Manrope', system-ui, sans-serif;\n  --font-mono: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;\n\n  /* ---- TYPE SCALE (1920 baseline; scales fine via clamp on web) --- */\n  --fs-hero:   clamp(56px, 7vw, 128px);  /* Massive brand title \"ЭмплиФлоу\" */\n  --fs-h1:     clamp(40px, 4.5vw, 76px); /* Section heroes */\n  --fs-h2:     clamp(32px, 3vw, 52px);   /* Card titles, big stats */\n  --fs-h3:     clamp(22px, 1.6vw, 28px); /* Sub-headings */\n  --fs-h4:     20px;\n  --fs-body-l: 20px;\n  --fs-body:   17px;\n  --fs-body-s: 15px;\n  --fs-caption:13px;\n  --fs-eyebrow:12px;\n\n  /* ---- LINE HEIGHT / TRACKING ------------------------------------- */\n  --lh-tight: 1.02;\n  --lh-snug:  1.12;\n  --lh-base:  1.45;\n  --lh-loose: 1.6;\n\n  --tr-tight: -0.02em;\n  --tr-base:   0em;\n  --tr-eyebrow: 0.12em;\n\n  --fw-light: 300;\n  --fw-reg: 400;\n  --fw-med: 500;\n  --fw-semi: 600;\n  --fw-bold: 700;\n  --fw-black: 800;\n\n  /* ---- SPACING SCALE (4px base) ----------------------------------- */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 24px;\n  --s-6: 32px;\n  --s-7: 48px;\n  --s-8: 64px;\n  --s-9: 96px;\n  --s-10: 128px;\n\n  /* ---- RADII — rounded but tactile -------------------------------- */\n  --r-xs: 8px;\n  --r-sm: 14px;\n  --r-md: 20px;\n  --r-lg: 28px;\n  --r-xl: 40px;\n  --r-2xl: 56px;\n  --r-pill: 999px;\n\n  /* ---- SHADOWS ----------------------------------------------------- */\n  --shadow-card: 0 2px 0 rgba(0,0,0,0.04), 0 24px 60px -20px rgba(5,2,48,0.55);\n  --shadow-glow-indigo: 0 0 80px -10px rgba(74,59,255,0.55);\n  --shadow-glow-pink:   0 0 80px -10px rgba(255,184,226,0.45);\n\n  /* ---- MOTION ------------------------------------------------------ */\n  --ease-out: cubic-bezier(.2,.7,.2,1);\n  --ease-in-out: cubic-bezier(.7,0,.2,1);\n  --t-fast: 150ms;\n  --t-base: 240ms;\n  --t-slow: 420ms;\n}\n\n/* =============================================================\n   SEMANTIC CLASSES — drop on elements directly\n   ============================================================= */\n\nhtml, body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-base);\n  color: var(--fg1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n.h-hero {\n  font-family: var(--font-display);\n  font-size: var(--fs-hero);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.03em;\n}\n.h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n}\n.h2 {\n  font-size: var(--fs-h2);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n}\n.h3 {\n  font-size: var(--fs-h3);\n  font-weight: var(--fw-semi);\n  line-height: 1.25;\n}\n.h4 { font-size: var(--fs-h4); font-weight: var(--fw-semi); }\n\n.body-l { font-size: var(--fs-body-l); line-height: var(--lh-base); }\n.body   { font-size: var(--fs-body);   line-height: var(--lh-base); }\n.body-s { font-size: var(--fs-body-s); line-height: var(--lh-base); }\n\n.caption {\n  font-size: var(--fs-caption);\n  color: var(--fg3);\n  line-height: 1.4;\n}\n.eyebrow {\n  font-size: var(--fs-eyebrow);\n  letter-spacing: var(--tr-eyebrow);\n  text-transform: uppercase;\n  font-weight: var(--fw-semi);\n  color: var(--fg2);\n}\n\n.t-mint   { color: var(--c-frosted-mint); }\n.t-pink   { color: var(--c-cotton-candy); }\n.t-indigo { color: var(--c-blue-ribbon); }\n.t-fog    { color: var(--c-fog); }\n.t-orange { color: var(--c-mac-cheese); }\n<\u002Fstyle>\n<style>\n  /* ---- print canvas: 1m × 2m = 1000 × 2000 px @ 1:2 ----- */\n  :root {\n    --w: 1000px;\n    --h: 2000px;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { background: #1a1438; font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }\n\n  /* Fit-to-screen scaling for on-screen preview */\n  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px; }\n  .rollup {\n    width: var(--w);\n    height: var(--h);\n    background: #050230;\n    color: #fff;\n    position: relative;\n    overflow: hidden;\n    box-shadow: 0 40px 120px -30px rgba(0,0,0,.7);\n    transform-origin: center top;\n  }\n  @media (max-aspect-ratio: 1/2) { .rollup { transform: scale(calc((100vw - 48px) / 1000)); } }\n  @media (min-aspect-ratio: 1/2) { .rollup { transform: scale(calc((100vh - 48px) / 2000)); } }\n\n  /* ---- ambient bloom layer (deep navy with indigo + pink glows) ---- */\n  .bg-bloom {\n    position: absolute; inset: 0; pointer-events: none;\n    background:\n      radial-gradient(45% 30% at 78% 8%,  rgba(74, 59, 255, 0.55) 0%, transparent 70%),\n      radial-gradient(40% 25% at 8% 40%,  rgba(255, 184, 226, 0.20) 0%, transparent 70%),\n      radial-gradient(50% 20% at 50% 70%, rgba(74, 59, 255, 0.30) 0%, transparent 70%);\n  }\n  .bg-grain {\n    position: absolute; inset: 0; opacity: .35; pointer-events: none; mix-blend-mode: overlay;\n    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px);\n  }\n\n  /* ---------------- shared chrome ---------------- */\n  .pad { padding: 0 60px; }\n  .eyebrow {\n    display: inline-flex; align-items: center; gap: 10px;\n    font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;\n    color: rgba(213,255,243,.85);\n  }\n  .eyebrow .dot { width: 8px; height: 8px; border-radius: 999px; background: #d5fff3; box-shadow: 0 0 12px #d5fff3; }\n\n  /* =================  1. HEADER  ================= */\n  .hdr { padding: 80px 60px 0; position: relative; z-index: 2; }\n  .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }\n  .brand {\n    font-family: 'Manrope', sans-serif; font-weight: 800;\n    font-size: 32px; letter-spacing: -0.03em; line-height: 1;\n  }\n  .brand-meta { font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: .14em; text-transform: uppercase; }\n\n  .h-headline {\n    font-family: 'Manrope', sans-serif; font-weight: 800;\n    font-size: 70px; line-height: 0.96; letter-spacing: -0.04em;\n    margin-top: 12px;\n  }\n  .h-headline .pink { color: #ffb8e2; }\n  .h-headline .mint { color: #d5fff3; }\n  .h-headline .ai-wrap {\n    display: inline-block; padding: 2px 18px;\n    border: 3px dashed #ffb8e2; border-radius: 999px;\n    color: #fff;\n  }\n\n  .h-sub {\n    margin-top: 18px; font-size: 18px; line-height: 1.4;\n    color: rgba(255,255,255,.78); max-width: 880px; font-weight: 400;\n  }\n\n  /* dashboard mockup — angled, sits BELOW the subheadline, inline */\n  .dash-wrap {\n    margin: 46px 0 0;\n    height: 250px;\n    transform: rotate(-2.5deg);\n    filter: drop-shadow(0 26px 50px rgba(74,59,255,0.45));\n    position: relative; z-index: 1;\n  }\n  .dash {\n    background: linear-gradient(180deg, #f6f4ff 0%, #ffffff 100%);\n    border-radius: 22px; padding: 18px; height: 100%;\n    box-shadow: 0 2px 0 rgba(0,0,0,.04), inset 0 0 0 1px rgba(0,0,0,.04);\n    display: grid; grid-template-columns: 200px 1fr 1fr; gap: 14px;\n  }\n  .dash .panel { background: #f3f1ff; border-radius: 14px; padding: 12px; }\n  .dash .person { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }\n  .dash .ava { width: 36px; height: 36px; border-radius: 999px; background: linear-gradient(135deg, #ffb8e2, #cec8ff); }\n  .dash .name { font-size: 12px; color: #050230; font-weight: 700; line-height: 1.1; }\n  .dash .role { font-size: 9px; color: rgba(5,2,48,.55); }\n  .dash .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; background: #d5fff3; color: #050230; font-size: 9px; font-weight: 700; margin-bottom: 4px; }\n  .dash .row { display: flex; justify-content: space-between; font-size: 10px; color: rgba(5,2,48,.7); padding: 3px 0; border-bottom: 1px solid rgba(5,2,48,.06); }\n  .dash .row:last-child { border: 0; }\n  .dash .row b { color: #050230; font-weight: 700; }\n  .dash .chart { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding: 4px 0; }\n  .dash .bar { flex: 1; background: linear-gradient(180deg, #4a3bff, #cec8ff); border-radius: 4px; }\n  .dash .label { font-size: 10px; color: #050230; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; }\n  .dash .label .ai-tag { font-size: 8px; padding: 2px 6px; background: #050230; color: #fff; border-radius: 999px; letter-spacing: .08em; }\n  .dash .ring-wrap { display: flex; align-items: center; gap: 8px; margin-top: 6px; }\n  .dash .ring { width: 56px; height: 56px; border-radius: 999px;\n    background: conic-gradient(#4a3bff 0 78%, #e6e3ff 78% 100%);\n    display: grid; place-items: center;\n  }\n  .dash .ring::before { content: \"\"; width: 38px; height: 38px; border-radius: 999px; background: #f3f1ff; position: absolute; }\n  .dash .ring span { position: relative; font-size: 12px; font-weight: 700; color: #050230; }\n  .dash .ai-rec { font-size: 10px; color: #050230; line-height: 1.35; margin-top: 6px; }\n  .dash .ai-rec b { color: #4a3bff; }\n\n  /* sparkles */\n  .spark { position: absolute; pointer-events: none; }\n\n  /* =================  2. VALUE CARDS  ================= */\n  .values { margin-top: 36px; padding: 0 60px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; position: relative; z-index: 2; }\n  .v-card {\n    border-radius: 24px; padding: 20px 20px; color: #050230;\n    min-height: 200px; display: flex; flex-direction: column; justify-content: space-between;\n    position: relative; overflow: hidden;\n  }\n  .v-card .v-icon {\n    width: 42px; height: 42px; border-radius: 12px;\n    background: rgba(5,2,48,.10); display: grid; place-items: center;\n  }\n  .v-card.is-dark { color: #fff; }\n  .v-card.is-dark .v-icon { background: rgba(255,255,255,.18); }\n  .v-card h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; margin-top: 12px; }\n  .v-card .v-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }\n  .v-card .v-tag {\n    font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px;\n    background: rgba(5,2,48,.08);\n  }\n  .v-card.is-dark .v-tag { background: rgba(255,255,255,.18); color: #fff; }\n\n  /* =================  3. MODULES  ================= */\n  .modules { margin-top: 32px; padding: 0 60px; position: relative; z-index: 2; }\n  .m-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }\n  .m-title {\n    font-family: 'Manrope', sans-serif; font-weight: 800;\n    font-size: 44px; letter-spacing: -0.035em; line-height: 1;\n  }\n  .m-title .accent { color: #d5fff3; }\n  .m-sub { font-size: 13px; color: rgba(255,255,255,.55); max-width: 260px; text-align: right; letter-spacing: .04em; }\n  .m-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }\n  .m-card {\n    background: rgba(217,214,255,0.06);\n    border: 1px solid rgba(217,214,255,0.18);\n    border-radius: 20px; padding: 18px 20px; backdrop-filter: blur(20px);\n    position: relative; overflow: hidden;\n  }\n  .m-card.glow::before {\n    content: \"\"; position: absolute; inset: -30px; pointer-events: none;\n    background: radial-gradient(40% 60% at 80% 0%, rgba(74,59,255,0.35) 0%, transparent 60%);\n  }\n  .m-icon {\n    width: 40px; height: 40px; border-radius: 10px;\n    background: #050230; border: 1px solid rgba(217,214,255,.25);\n    display: grid; place-items: center; color: #d5fff3; margin-bottom: 10px;\n    position: relative;\n  }\n  .m-card.is-ai .m-icon { background: linear-gradient(135deg, #4a3bff, #ffb8e2); border-color: transparent; color: #fff; box-shadow: 0 0 24px rgba(74,59,255,.6); }\n  .m-card h4 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }\n  .m-card p { font-size: 12px; color: rgba(255,255,255,.65); line-height: 1.4; margin-top: 6px; }\n  .m-ai-pill {\n    position: absolute; top: 14px; right: 14px;\n    font-size: 9px; font-weight: 700; padding: 3px 7px;\n    background: #ffb8e2; color: #050230; border-radius: 999px; letter-spacing: .1em;\n  }\n\n  /* =================  4. SOCIAL PROOF  ================= */\n  .social { margin-top: 28px; padding: 0 60px; position: relative; z-index: 2; }\n  .social .lbl { font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 10px; }\n  .logos { display: flex; align-items: stretch; justify-content: space-between; gap: 14px; margin-bottom: 16px; }\n  .logo-chip {\n    flex: 1;\n    background: #fff;\n    border-radius: 18px;\n    padding: 14px 22px;\n    height: 76px;\n    display: flex; align-items: center; justify-content: center;\n    position: relative;\n  }\n  .logo-chip img { max-height: 44px; max-width: 100%; object-fit: contain; display: block; }\n  .logo-chip.glow-indigo { box-shadow: 0 0 50px -6px rgba(74,59,255,0.70), 0 0 20px rgba(74,59,255,0.30); }\n  .logo-chip.glow-pink   { box-shadow: 0 0 50px -6px rgba(255,184,226,0.70), 0 0 20px rgba(255,184,226,0.30); }\n  .logo-chip.glow-mint   { box-shadow: 0 0 50px -6px rgba(213,255,243,0.70), 0 0 20px rgba(213,255,243,0.30); }\n  .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n  .check {\n    background: rgba(213,255,243,0.08);\n    border: 1px solid rgba(213,255,243,.30);\n    border-radius: 14px; padding: 12px 14px;\n    display: flex; align-items: center; gap: 10px;\n    font-size: 13px; font-weight: 600; line-height: 1.2;\n  }\n  .check svg { flex: none; }\n\n  /* =================  5. CTA / FOOTER  ================= */\n  .cta {\n    margin-top: 40px; padding: 22px 60px 34px;\n    background: linear-gradient(180deg, transparent 0%, #0a0540 30%);\n    position: relative; z-index: 2;\n  }\n  .cta-row { display: grid; grid-template-columns: 1fr 170px; gap: 24px; align-items: center; }\n  .cta-text {\n    font-family: 'Manrope', sans-serif; font-weight: 800;\n    font-size: 46px; line-height: 0.96; letter-spacing: -0.035em;\n  }\n  .cta-text .demo { color: #ffb777; }\n  .cta-sub {\n    margin-top: 10px; font-size: 16px; color: rgba(255,255,255,.7);\n  }\n  .qr {\n    width: 170px; height: 170px; background: #fff; border-radius: 18px;\n    padding: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.5);\n  }\n  .qr svg { width: 100%; height: 100%; }\n  .qr-label { text-align: center; margin-top: 8px; font-size: 11px; color: rgba(255,255,255,.7); letter-spacing: .12em; text-transform: uppercase; }\n\n  .contacts {\n    margin-top: 14px; padding-top: 12px;\n    border-top: 1px solid rgba(217,214,255,.16);\n    display: flex; justify-content: space-between; align-items: center;\n    font-size: 16px; color: #fff;\n  }\n  .contacts .em { color: #d5fff3; font-weight: 600; }\n\n  /* ============== v2 overrides: cropped layout ============== */\n  .v2-gap {\n    margin-top: 105px;\n    padding: 0 60px 0;\n    position: relative; z-index: 2;\n  }\n  .v2-gap .v2-eyebrow {\n    font-size: 16px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;\n    color: #d5fff3; margin-bottom: 18px;\n    display: inline-flex; align-items: center; gap: 12px;\n  }\n  .v2-gap .v2-eyebrow .bar { width: 60px; height: 2px; background: #d5fff3; border-radius: 999px; }\n  .v2-gap .v2-title {\n    font-family: 'Manrope', sans-serif; font-weight: 800;\n    font-size: 64px; letter-spacing: -0.035em; line-height: 0.98;\n    margin-bottom: 52px; color: #fff;\n  }\n  .v2-gap .v2-title .accent { color: #ffb8e2; }\n  .values.v2 {\n    margin-top: 0;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 16px;\n  }\n  .values.v2 .v-card {\n    min-height: 475px;\n    padding: 28px 24px;\n    border-radius: 28px;\n  }\n  .values.v2 .v-card .v-icon {\n    width: 56px; height: 56px; border-radius: 16px;\n  }\n  .values.v2 .v-card .v-icon svg { width: 30px; height: 30px; }\n  .values.v2 .v-card h3 {\n    font-size: 30px; line-height: 1.06; margin-top: 24px;\n    letter-spacing: -0.025em;\n  }\n  .values.v2 .v-card .v-tags { gap: 9px; margin-top: 18px; }\n  .values.v2 .v-card .v-tag {\n    font-size: 19px; padding: 10px 18px; font-weight: 600;\n  }\n\n  /* =================  PRINT  ================= */\n  @media print {\n    /* Page exactly matches the 1000×2000 px canvas (96 DPI → 264.58 × 529.17 mm).\n       Print shop scales to 1×2 m (~3.78×). */\n    @page { size: 264.5833mm 529.1667mm; margin: 0; }\n    html, body {\n      margin: 0 !important; padding: 0 !important; background: #050230 !important;\n      width: 264.5833mm; height: 529.1667mm;\n      -webkit-print-color-adjust: exact;\n      print-color-adjust: exact;\n      color-adjust: exact;\n    }\n    .stage {\n      padding: 0 !important; margin: 0 !important;\n      min-height: 0 !important;\n      display: block !important;\n      width: 100% !important; height: 100% !important;\n    }\n    .rollup {\n      transform: none !important;\n      transform-origin: top left !important;\n      width: 1000px !important;\n      height: 2000px !important;\n      margin: 0 !important;\n      box-shadow: none !important;\n      break-inside: avoid; page-break-inside: avoid;\n      position: relative !important;\n      left: 0 !important; right: auto !important; top: 0 !important;\n    }\n    .rollup * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }\n  }\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"stage\">\n<div class=\"rollup\" data-screen-label=\"Roll-up · 1×2 m\">\n  <div class=\"bg-bloom\"><\u002Fdiv>\n  <div class=\"bg-grain\"><\u002Fdiv>\n\n  <!-- floating sparkles -->\n  <svg class=\"spark\" style=\"top:1115px; right:80px\" width=\"30\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"#ffb8e2\"><path d=\"M12 0L13.5 10.5 24 12 13.5 13.5 12 24 10.5 13.5 0 12 10.5 10.5z\"><\u002Fpath><\u002Fsvg>\n  <svg class=\"spark\" style=\"top:560px; left:40px\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"#d5fff3\"><path d=\"M12 0L13.5 10.5 24 12 13.5 13.5 12 24 10.5 13.5 0 12 10.5 10.5z\"><\u002Fpath><\u002Fsvg>\n  <svg class=\"spark\" style=\"top:140px; left:280px\" width=\"14\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"#cec8ff\"><
