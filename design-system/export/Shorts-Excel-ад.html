document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

* Deep navy — primary background */\n  --c-black-rock-2: #0a0540;       /* Slightly lifted */\n  --c-blue-ribbon: #4a3bff;        /* Primary action / brand indigo */\n  --c-blue-ribbon-deep: #3a2cf0;\n  --c-cotton-candy: #ffb8e2;       /* Pink accent — highlight text, dashed callouts */\n  --c-periwinkle: #cec8ff;         /* Lavender tile */\n  --c-fog: #d9d6ff;                /* Lighter lavender — surfaces, secondary text on dark */\n  --c-frosted-mint: #d5fff3;       /* Mint tile / brand-name highlight */\n  --c-mac-cheese: #ffb777;         /* Soft orange CTA + tile */\n  --c-cod-gray: #151515;           /* Near-black for dark-on-pastel */\n  --c-black: #000000;\n  --c-white: #ffffff;\n\n  /* ---- SEMANTIC SURFACES (dark theme, the brand default) ---------- */\n  --bg: var(--c-black-rock);\n  --bg-elevated: #0d0848;\n  --bg-glass: rgba(217, 214, 255, 0.06);\n  --bg-glass-strong: rgba(217, 214, 255, 0.10);\n\n  /* ---- SEMANTIC FOREGROUNDS --------------------------------------- */\n  --fg1: var(--c-white);           /* Primary text on dark */\n  --fg2: rgba(255, 255, 255, 0.72);/* Secondary */\n  --fg3: rgba(255, 255, 255, 0.48);/* Tertiary, captions */\n  --fg-mute: rgba(217, 214, 255, 0.32);\n\n  --fg-on-light: var(--c-cod-gray);\n  --fg-on-light-2: rgba(21, 21, 21, 0.66);\n\n  --fg-accent: var(--c-cotton-candy);\n  --fg-brand: var(--c-blue-ribbon);\n\n  /* ---- STROKES ----------------------------------------------------- */\n  --stroke: rgba(217, 214, 255, 0.12);\n  --stroke-strong: rgba(217, 214, 255, 0.22);\n  --stroke-dashed-accent: var(--c-cotton-candy);\n\n  /* ---- TYPE FAMILIES ---------------------------------------------- */\n  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;\n  --font-display: 'Manrope', system-ui, sans-serif;\n  --font-mono: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;\n\n  /* ---- TYPE SCALE (1920 baseline; scales fine via clamp on web) --- */\n  --fs-hero:   clamp(56px, 7vw, 128px);  /* @kind font */ /* Massive brand title */\n  --fs-h1:     clamp(40px, 4.5vw, 76px); /* @kind font */ /* Section heroes */\n  --fs-h2:     clamp(32px, 3vw, 52px);   /* @kind font */ /* Card titles, big stats */\n  --fs-h3:     clamp(22px, 1.6vw, 28px); /* @kind font */ /* Sub-headings */\n  --fs-h4:     20px;   /* @kind font */\n  --fs-body-l: 20px;   /* @kind font */\n  --fs-body:   17px;   /* @kind font */\n  --fs-body-s: 15px;   /* @kind font */\n  --fs-caption:13px;   /* @kind font */\n  --fs-eyebrow:12px;   /* @kind font */\n\n  /* ---- LINE HEIGHT / TRACKING ------------------------------------- */\n  --lh-tight: 1.02;  /* @kind font */\n  --lh-snug:  1.12;  /* @kind font */\n  --lh-base:  1.45;  /* @kind font */\n  --lh-loose: 1.6;   /* @kind font */\n\n  --tr-tight: -0.02em;   /* @kind font */\n  --tr-base:   0em;      /* @kind font */\n  --tr-eyebrow: 0.12em;  /* @kind font */\n\n  --fw-light: 300;  /* @kind font */\n  --fw-reg: 400;    /* @kind font */\n  --fw-med: 500;    /* @kind font */\n  --fw-semi: 600;   /* @kind font */\n  --fw-bold: 700;   /* @kind font */\n  --fw-black: 800;  /* @kind font */\n\n  /* ---- SPACING SCALE (4px base) ----------------------------------- */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 24px;\n  --s-6: 32px;\n  --s-7: 48px;\n  --s-8: 64px;\n  --s-9: 96px;\n  --s-10: 128px;\n\n  /* ---- RADII — rounded but tactile -------------------------------- */\n  --r-xs: 8px;\n  --r-sm: 14px;\n  --r-md: 20px;\n  --r-lg: 28px;\n  --r-xl: 40px;\n  --r-2xl: 56px;\n  --r-pill: 999px;\n\n  /* ---- SHADOWS ----------------------------------------------------- */\n  --shadow-card: 0 2px 0 rgba(0,0,0,0.04), 0 24px 60px -20px rgba(5,2,48,0.55);\n  --shadow-glow-indigo: 0 0 80px -10px rgba(74,59,255,0.55);\n  --shadow-glow-pink:   0 0 80px -10px rgba(255,184,226,0.45);\n\n  /* ---- MOTION ------------------------------------------------------ */\n  --ease-out: cubic-bezier(.2,.7,.2,1);     /* @kind other */\n  --ease-in-out: cubic-bezier(.7,0,.2,1);   /* @kind other */\n  --t-fast: 150ms;   /* @kind other */\n  --t-base: 240ms;   /* @kind other */\n  --t-slow: 420ms;   /* @kind other */\n}\n\n/* =============================================================\n   SEMANTIC CLASSES — drop on elements directly\n   ============================================================= */\n\nhtml, body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-base);\n  color: var(--fg1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n.h-hero {\n  font-family: var(--font-display);\n  font-size: var(--fs-hero);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.03em;\n}\n.h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n}\n.h2 {\n  font-size: var(--fs-h2);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n}\n.h3 {\n  font-size: var(--fs-h3);\n  font-weight: var(--fw-semi);\n  line-height: 1.25;\n}\n.h4 { font-size: var(--fs-h4); font-weight: var(--fw-semi); }\n\n.body-l { font-size: var(--fs-body-l); line-height: var(--lh-base); }\n.body   { font-size: var(--fs-body);   line-height: var(--lh-base); }\n.body-s { font-size: var(--fs-body-s); line-height: var(--lh-base); }\n\n.caption {\n  font-size: var(--fs-caption);\n  color: var(--fg3);\n  line-height: 1.4;\n}\n.eyebrow {\n  font-size: var(--fs-eyebrow);\n  letter-spacing: var(--tr-eyebrow);\n  text-transform: uppercase;\n  font-weight: var(--fw-semi);\n  color: var(--fg2);\n}\n\n.t-mint   { color: var(--c-frosted-mint); }\n.t-pink   { color: var(--c-cotton-candy); }\n.t-indigo { color: var(--c-blue-ribbon); }\n.t-fog    { color: var(--c-fog); }\n.t-orange { color: var(--c-mac-cheese); }\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body {\n    background:\n      radial-gradient(60% 40% at 12% 0%, rgba(74,59,255,.18) 0%, transparent 60%),\n      radial-gradient(50% 30% at 100% 8%, rgba(255,184,226,.10) 0%, transparent 60%),\n      var(--c-black-rock);\n    color: var(--fg1);\n    font-family: var(--font-sans);\n    min-height: 100vh;\n  }\n  .wrap { max-width: 1240px; margin: 0 auto; padding: 56px 40px 96px; }\n\n  /* ============ HEADER ============ */\n  .top { display: flex; gap: 48px; align-items: stretch; }\n  .top-l { flex: 1; min-width: 0; display: flex; flex-direction: column; }\n  .kicker {\n    display: inline-flex; align-items: center; gap: 10px;\n    font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;\n    color: var(--c-cotton-candy);\n  }\n  .kicker .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--c-cotton-candy); box-shadow: 0 0 12px var(--c-cotton-candy); }\n  .series {\n    margin-top: 18px; font-size: 15px; color: var(--fg2); font-weight: 500;\n  }\n  .title {\n    margin-top: 10px;\n    font-size: clamp(44px, 6vw, 76px); font-weight: 800; line-height: .98; letter-spacing: -0.03em;\n  }\n  .title .hl {\n    background: var(--c-blue-ribbon); color: #fff;\n    padding: 0 .12em; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone;\n    transform: rotate(-1.2deg); display: inline-block;\n  }\n  .logline {\n    margin-top: 22px; max-width: 560px; font-size: 18px; line-height: 1.5; color: var(--fg2);\n  }\n  .logline b { color: var(--fg1); font-weight: 700; }\n\n  .specs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }\n  .spec {\n    font-size: 12.5px; font-weight: 600; color: var(--fg2);\n    background: var(--bg-glass); border: 1px solid var(--stroke);\n    border-radius: 999px; padding: 7px 14px;\n  }\n  .spec b { color: var(--c-frosted-mint); font-weight: 700; }\n\n  .tags { margin-top: auto; padding-top: 26px; display: flex; flex-wrap: wrap; gap: 14px; }\n  .tag { font-size: 13px; font-weight: 600; color: var(--c-fog); opacity: .75; }\n\n  .ctrl {\n    margin-top: 22px;\n    display: inline-flex; align-items: center; gap: 11px;\n    align-self: flex-start;\n    background: var(--bg-glass); border: 1px solid var(--stroke-strong);\n    border-radius: 999px; padding: 9px 16px 9px 12px; cursor: pointer;\n    color: var(--fg2); font-size: 13px; font-weight: 600; user-select: none;\n    transition: background var(--t-base) var(--ease-out);\n  }\n  .ctrl:hover { background: var(--bg-glass-strong); }\n  .ctrl .sw {\n    width: 38px; height: 22px; border-radius: 999px; background: rgba(217,214,255,.18);\n    position: relative; transition: background var(--t-base) var(--ease-out); flex: none;\n  }\n  .ctrl .sw::after {\n    content: \"\"; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;\n    border-radius: 999px; background: var(--c-fog); transition: transform var(--t-base) var(--ease-out);\n  }\n  body.show-safe .ctrl .sw { background: var(--c-blue-ribbon); }\n  body.show-safe .ctrl .sw::after { transform: translateX(16px); background: #fff; }\n\n  /* cover frame on right of header */\n  .top-r { flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; }\n  .cover-cap { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg3); font-weight: 700; }\n\n  /* ============ FRAME SCALER ============ */\n  .fw { position: relative; overflow: hidden; border-radius: 26px; background: #000;\n        box-shadow: 0 30px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(217,214,255,.10) inset; }\n  .fw-lg { width: 392px; height: 696.9px; }\n  .fw-sm { width: 300px; height: 533.3px; }\n  .frame { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; transform-origin: top left; overflow: hidden; }\n  .fw-lg .frame { transform: scale(0.36296); }\n  .fw-sm .frame { transform: scale(0.27778); }\n\n  /* base scene background */\n  .scn { position: absolute; inset: 0; background: n-break: clone; box-decoration-break: clone;\n    color: #fff; font-size: 40px; font-weight: 600; line-height: 1.62; letter-spacing: -0.01em;\n    padding: 8px 16px; border-radius: 10px;\n  }\n\n  /* =================================================================\n     SCENE 1 — Excel hell spreadsheet\n     ================================================================= */\n  .xl { position: absolute; inset: 0; background: #eef1f7; }\n  .xl-head {\n    display: flex; height: 64px; background: #1f7a4d; color: #fff; align-items: center; padding: 0 20px; gap: 18px;\n    font-size: 24px; font-weight: 700; font-family: var(--font-mono);\n  }\n  .xl-head .dotw { width: 14px; height: 14px; border-radius: 999px; background: rgba(255,255,255,.5); }\n  .xl-cols { display: grid; grid-template-columns: 1.4fr .7fr .7fr .7fr .7fr .8fr; background: #d7deea; border-bottom: 2px solid #b9c4d6; }\n  .xl-cols div { padding: 14px 16px; font-size: 22px; font-weight: 700; color: #3b475c; font-family: var(--font-mono); border-right: 1px solid #c3ccdb; }\n  .xl-rows { font-family: var(--font-mono); }\n  .xl-row { display: grid; grid-template-columns: 1.4fr .7fr .7fr .7fr .7fr .8fr; border-bottom: 1px solid #d3dae6; }\n  .xl-row:nth-child(even) { background: #f6f8fc; }\n  .xl-row div { padding: 13px 16px; font-size: 22px; color: #46536a; border-right: 1px solid #e0e6f0; white-space: nowrap; overflow: hidden; }\n  .xl-row .nm { color: #1f2b3e; font-weight: 600; }\n  .xl-tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,2,48,.12) 0%, rgba(5,2,48,.55) 64%, rgba(5,2,48,.82) 100%); mix-blend-mode: multiply; }\n  .xl-tint2 { position: absolute; inset: 0; background: radial-gradient(60% 50% at 50% 60%, transparent 0%, rgba(5,2,48,.5) 100%); }\n  .cursor { position: absolute; z-index: 25; width: 54px; height: 54px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }\n\n  /* =================================================================\n     SCENE 2 — scattered file рии для Canva AI<\u002Fh2>\n    <span class=\"line\"><\u002Fspan>\n    <span class=\"meta\">единый визуальный язык всех выпусков<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"notes\">\n    <div class=\"note\"><div class=\"nl\">Фон и свет<\u002Fdiv><div class=\"nv\">Тёмный <b>navy → violet<\u002Fb> градиент, лёгкое движение (медленный параллакс/глоу), стеклянные карточки.<\u002Fdiv><\u002Fdiv>\n    <div class=\"note\"><div class=\"nl\">Акцент и текст<\u002Fdiv><div class=\"nv\">Кинетические плашки: ключевые слова «вылетают» и подсвечиваются <b>violet-заливкой<\u002Fb>. 5–6 слов в строке. Манроп.<\u002Fdiv><\u002Fdiv>\n    <div class=\"note\"><div class=\"nl\">Голос<\u002Fdiv><div class=\"nv\">Единый закадровый рассказчик, мужской, <b>30–35 лет<\u002Fb>, тёплый, разговорный. Один голос во всех выпусках.<\u002Fdiv><\u002Fdiv>\n    <div class=\"note\"><div class=\"nl\">Музыка<\u002Fdiv><div class=\"nv\">Минималистичный электронный бит, низкий, под голосом <b>−18…−20 dB<\u002Fb>. Whoosh/click на плашках.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<script>\n  // Safe-zone toggle\n  (function(){\n    var t = document.getElementById('safeToggle');\n    function flip(){\n      var on = document.body.classList.toggle('show-safe');\n      t.setAttribute('aria-pressed', on ? 'true' : 'false');\n    }\n    t.addEventListener('click', flip);\n    t.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); }});\n  })();\n\n  // Decorative spreadsheet rows (background only)\n  (function(){\n    var names = ['Иванов И.','Петрова А.','Смирнов Д.','Кузнецова Е.','Попов Р.','Соколова М.','Лебедев К.','Новикова О.','Морозов П.','Волкова Н.','Алексеев С.','Зайцева Т.','Орлов В.','Федорова Ю.','Макаров А.','Громова Л.'];\n    function rnd(a,b){ return (a + Math.random()*(b-a)); }\n    document.querySelectorAll('[data-xl]').forEach(function(host){\n      var html='';\n      for(var i=0;i<16;i++){\n        var n = names[i % names.length];\n        html += '<div class=\"xl-row\">'\n          + '<div class=\"nm\">'+n+'<\u002Fdiv>'\n          + '<div>'+rnd(3.1,4.9).toFixed(1)+'<\u002Fdiv>'\n          + '<div>'+Math.round(rnd(62,99))+'%<\u002Fdiv>'\n          + '<div>'+Math.round(rnd(2,6))+'/6<\u002Fdiv>'\n          + '<div>'+rnd(2.8,4.8).toFixed(1)+'<\u002Fdiv>'\n          + '<div>'+rnd(3.2,4.8).toFixed(1)+'<\u002Fdiv>'\n          + '<\u002Fdiv>';\n      }\n      host.innerHTML = html;\n    });\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
