<!doctype html>
<!-- @dsCard group="Components" name="Stat Tiles" subtitle="Big-number stats with unit pill" viewport="700x300" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { display: flex; align-items: stretch; gap: 14px; padding: 18px; }
.stat { flex: 1; border-radius: 28px; padding: 22px; min-height: 240px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
.stat.peri { background: #cec8ff; color: #151515; }
.stat.pink { background: #ffb8e2; color: #151515; }
.stat.indigo { background: #4a3bff; color: #fff; }
.num { font-family: 'Manrope', sans-serif; font-size: 80px; font-weight: 700; line-height: 0.9; letter-spacing: -0.04em; }
.unit { font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #fff; color: #151515; display: inline-block; margin-left: 6px; vertical-align: middle; }
.indigo .unit { color: #151515; }
.label { font-size: 13px; line-height: 1.4; opacity: .8; }
.eyebrow { font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.08); display: inline-block; letter-spacing: .12em; text-transform: uppercase; }
</style></head><body>
<div class="stat peri">
  <div><div class="num">5+</div></div>
  <span class="eyebrow">Заказчиков</span>
</div>
<div class="stat pink">
  <div><span class="num">&gt;35</span><span class="unit">млн ₽</span></div>
  <div class="label">в год — экономическая окупаемость внедрения нашей платформы для компании</div>
</div>
<div class="stat indigo">
  <div><span class="num">500+</span><span class="unit">млн ₽</span></div>
  <div class="label" style="color:rgba(255,255,255,.85)">сэкономили компаниям на автоматизации</div>
</div>
</body></html>
