<!doctype html>
<!-- @dsCard group="Components" name="Figures Panel" subtitle="EmplyFlow в цифрах — панель с показателями" viewport="980x720" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { display:block; padding:16px; }
.panel { background:#6246ff; border-radius:28px; padding:22px; color:#fff; }
.badge { display:inline-flex; gap:8px; align-items:center; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.16); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.dot { width:8px; height:8px; border-radius:50%; background:#7dffc8; }
h2 { margin:14px 0 0; font-size:32px; line-height:1.05; letter-spacing:-.04em; max-width:12em; }
h2 span { background:#ffb8e2; color:#151515; border-radius:6px; padding:0 6px; }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.card { border-radius:18px; padding:14px; color:#151515; min-height:140px; }
.mint { background:#d8ffe9; } .pink { background:#ffc6e4; }
.num { font-size:40px; font-weight:800; letter-spacing:-.04em; margin:8px 0 0; }
</style></head><body>
<div class="panel">
  <div class="badge"><span class="dot"></span>EmplyFlow в цифрах</div>
  <h2>Ваши HR-процессы. Ваши правила.<br><span>Результат под контролем.</span></h2>
  <div class="pair">
    <div class="card mint"><div>Цели</div><div class="num">81%</div></div>
    <div class="card pink"><div>Удобство</div><div class="num">86,8%</div></div>
  </div>
</div>
</body></html>
