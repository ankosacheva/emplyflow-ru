<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Brand Core" subtitle="Black Rock, Blue Ribbon, Mac & Cheese, Cotton Candy" viewport="700x220" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
.swatch { flex: 1; height: 100%; min-height: 160px; border-radius: 14px; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; position: relative; overflow: hidden; }
.swatch .name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.swatch .hex  { font-size: 11px; opacity: .65; margin-top: 2px; font-family: ui-monospace, monospace; letter-spacing: .03em; }
.swatch.on-dark { color: #fff; }
.swatch.on-dark .hex { opacity: .55; }
.swatch.on-light { color: #151515; }
.swatch.stroke { box-shadow: inset 0 0 0 1px rgba(217,214,255,0.22); }
</style></head><body>
<div class="card-root">
  <div class="swatch on-dark stroke" style="background:#050230"><div class="name">Black Rock</div><div class="hex">#050230</div></div>
  <div class="swatch on-light" style="background:#4a3bff; color:#fff"><div class="name">Blue Ribbon</div><div class="hex" style="color:rgba(255,255,255,.7)">#4A3BFF · primary action</div></div>
  <div class="swatch on-light" style="background:#ffb777"><div class="name">Macaroni &amp; Cheese</div><div class="hex">#FFB777 · header CTA</div></div>
  <div class="swatch on-light" style="background:#ffb8e2"><div class="name">Cotton Candy</div><div class="hex">#FFB8E2 · AI accent</div></div>
</div>
</body></html>
