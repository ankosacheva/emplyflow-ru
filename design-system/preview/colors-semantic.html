<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Semantic" subtitle="Foreground / background / stroke tokens" viewport="700x330" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { display: block; padding: 20px 24px; }
.row { display: grid; grid-template-columns: 160px 1fr 110px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(217,214,255,0.10); font-size: 13px; }
.row:last-child { border: none; }
.label { font-weight: 600; }
.usage { color: rgba(255,255,255,0.65); font-size: 12px; }
.sample { height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(217,214,255,0.15); }
</style></head><body>
<div class="row"><span class="label">--fg1</span><span class="usage">Primary text on dark</span><span class="sample" style="background:#fff"></span></div>
<div class="row"><span class="label">--fg2</span><span class="usage">Secondary text · 72% white</span><span class="sample" style="background:rgba(255,255,255,0.72)"></span></div>
<div class="row"><span class="label">--fg3</span><span class="usage">Tertiary · captions · 48%</span><span class="sample" style="background:rgba(255,255,255,0.48)"></span></div>
<div class="row"><span class="label">--bg</span><span class="usage">Page canvas</span><span class="sample" style="background:#050230"></span></div>
<div class="row"><span class="label">--bg-glass</span><span class="usage">Glass panel · 6% fog</span><span class="sample" style="background:rgba(217,214,255,0.06)"></span></div>
<div class="row"><span class="label">--stroke</span><span class="usage">Hairline border · 12% fog</span><span class="sample" style="background:rgba(217,214,255,0.12)"></span></div>
<div class="row"><span class="label">--fg-accent</span><span class="usage">Pink callout text</span><span class="sample" style="background:#ffb8e2"></span></div>
<div class="row"><span class="label">--fg-brand</span><span class="usage">Indigo link / button</span><span class="sample" style="background:#4a3bff"></span></div>
</body></html>
