<!doctype html>
<!-- @dsCard group="Components" name="Metric Counters" subtitle="Tilted pastel counters for the hero edges" viewport="980x460" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 36px 24px; }
.card {
  width: 210px;
  padding: 16px 16px 18px;
  border-radius: 22px;
  color: #151515;
  box-shadow: 0 18px 40px -20px rgba(5,2,48,.62), inset 0 1px 0 rgba(255,255,255,.72);
}
.card--mint { background: #d5fff3; transform: rotate(-8deg); }
.card--pink { background: #ffb8e2; transform: rotate(7deg); }
.card--orange { background: #ffb777; transform: rotate(-6deg); }
.eyebrow {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  max-width: 11em;
  margin: 0;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  line-height: 1.25;
  text-transform: uppercase;
  color: rgba(21,21,21,.58);
}
.dot { width: 7px; height: 7px; margin-top: 3px; border-radius: 999px; background: #4a3bff; flex: 0 0 auto; }
.num { margin: 8px 0 4px; font-weight: 800; font-size: 42px; line-height: .9; letter-spacing: -.04em; }
.label { margin: 0; font-weight: 700; font-size: 15px; line-height: 1.15; letter-spacing: -.02em; }
</style></head><body>
<div class="card card--mint">
  <p class="eyebrow"><span class="dot"></span>Сейчас в системе</p>
  <p class="num">6 116</p>
  <p class="label">поставленных целей</p>
</div>
<div class="card card--pink">
  <p class="eyebrow"><span class="dot"></span>Сейчас в системе</p>
  <p class="num">15 279</p>
  <p class="label">заполненных анкет 360°</p>
</div>
<div class="card card--orange">
  <p class="eyebrow"><span class="dot"></span>Сейчас в системе</p>
  <p class="num">1 835</p>
  <p class="label">сформированных ИПР</p>
</div>
</body></html>
