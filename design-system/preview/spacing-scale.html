<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4-px base · geometric ladder" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #050230; color: #fff; font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: 24px 28px; }
.scale { display: flex; align-items: flex-end; gap: 14px; height: 130px; }
.item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 36px; }
.s { width: 28px; border-radius: 6px; box-shadow: 0 0 24px -8px currentColor; }
.label { font-size: 10px; color: rgba(255,255,255,.55); font-family: ui-monospace, monospace; }
.label b { color: #fff; font-weight: 600; }
.cap { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 10px; font-family: ui-monospace, monospace; }
.cap b { color: #d5fff3; font-weight: 600; }
</style></head><body>
<div class="scale">
  <div class="item"><div class="s" style="height:4px; background:#d5fff3; color:#d5fff3"></div><div class="label"><b>4</b><br>s-1</div></div>
  <div class="item"><div class="s" style="height:8px; background:#cec8ff; color:#cec8ff"></div><div class="label"><b>8</b><br>s-2</div></div>
  <div class="item"><div class="s" style="height:12px; background:#d9d6ff; color:#d9d6ff"></div><div class="label"><b>12</b><br>s-3</div></div>
  <div class="item"><div class="s" style="height:16px; background:#ffb8e2; color:#ffb8e2"></div><div class="label"><b>16</b><br>s-4</div></div>
  <div class="item"><div class="s" style="height:24px; background:#ffb777; color:#ffb777"></div><div class="label"><b>24</b><br>s-5</div></div>
  <div class="item"><div class="s" style="height:32px; background:#cec8ff; color:#cec8ff"></div><div class="label"><b>32</b><br>s-6</div></div>
  <div class="item"><div class="s" style="height:48px; background:#4a3bff; color:#4a3bff"></div><div class="label"><b>48</b><br>s-7</div></div>
  <div class="item"><div class="s" style="height:64px; background:#ffb8e2; color:#ffb8e2"></div><div class="label"><b>64</b><br>s-8</div></div>
  <div class="item"><div class="s" style="height:96px; background:#d5fff3; color:#d5fff3"></div><div class="label"><b>96</b><br>s-9</div></div>
  <div class="item"><div class="s" style="height:128px; background:#4a3bff; color:#4a3bff"></div><div class="label"><b>128</b><br>s-10</div></div>
</div>
<div class="cap"><b>4-px base</b> · geometric scale · color rotation echoes the tile system</div>
</body></html>
