<!doctype html>
<!-- @dsCard group="Components" name="Tile Cards" subtitle="Pastel card system with sparkle accent" viewport="700x320" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { display: flex; align-items: stretch; gap: 14px; padding: 18px; }
.tile { flex: 1; border-radius: 28px; padding: 22px; color: #151515; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; min-height: 260px; }
.tile h3 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; }
.tile p { font-size: 13px; margin-top: 10px; opacity: .8; line-height: 1.45; }
.tile .spark { position: absolute; right: 14px; top: 14px; }
.tile.mint { background: #d5fff3; }
.tile.pink { background: #ffb8e2; }
.tile.peri { background: #cec8ff; }
</style></head><body>
<div class="tile mint">
  <svg class="spark" width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0L13.5 10.5 24 12 13.5 13.5 12 24 10.5 13.5 0 12 10.5 10.5z"/></svg>
  <h3>Оценка результатов</h3>
  <p>Performance Review с KPI и достижением целей.</p>
</div>
<div class="tile pink">
  <svg class="spark" width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0L13.5 10.5 24 12 13.5 13.5 12 24 10.5 13.5 0 12 10.5 10.5z"/></svg>
  <h3>Анализ потенциала</h3>
  <p>360° оценка и автоматическая матрица потенциала.</p>
</div>
<div class="tile peri">
  <svg class="spark" width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0L13.5 10.5 24 12 13.5 13.5 12 24 10.5 13.5 0 12 10.5 10.5z"/></svg>
  <h3>План развития</h3>
  <p>Готовые ИПР для каждого сотрудника.</p>
</div>
</body></html>
