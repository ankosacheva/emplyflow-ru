<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows & Glows" subtitle="Drop shadow + colored glow accents" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
body { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 30px 24px; }
.box { width: 150px; height: 90px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; color: #151515; font-size: 12px; font-weight: 600; }
.box .k { font-family: ui-monospace, monospace; opacity: .55; font-weight: 400; margin-top: 4px; font-size: 10px; }
.card { box-shadow: 0 2px 0 rgba(0,0,0,0.04), 0 24px 60px -20px rgba(5,2,48,0.85); }
.glow-i { box-shadow: 0 0 80px -8px rgba(74,59,255,0.85); background: #4a3bff; color: #fff; }
.glow-p { box-shadow: 0 0 80px -8px rgba(255,184,226,0.85); background: #ffb8e2; }
</style></head><body>
<div class="box card">drop<div class="k">shadow-card</div></div>
<div class="box glow-i">glow indigo<div class="k" style="color:rgba(255,255,255,.6)">--shadow-glow-indigo</div></div>
<div class="box glow-p">glow pink<div class="k">--shadow-glow-pink</div></div>
</body></html>
