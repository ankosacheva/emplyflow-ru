<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Pastel Tiles" subtitle="The rotating card-tile palette" viewport="700x220" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Manrope', system-ui, sans-serif; background: #050230; }
body { padding: 14px; display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
.swatch { padding: 16px; color: #151515; display: flex; flex-direction: column; justify-content: flex-end; border-radius: 10px; }
.swatch .name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.swatch .hex  { font-size: 10px; opacity: .55; margin-top: 2px; font-family: ui-monospace, monospace; letter-spacing: .03em; }
.hero  { grid-row: span 2; }
</style></head><body>
<div class="swatch hero" style="background:#cec8ff"><div class="name">Periwinkle</div><div class="hex">#CEC8FF</div></div>
<div class="swatch" style="background:#d5fff3"><div class="name">Frosted Mint</div><div class="hex">#D5FFF3</div></div>
<div class="swatch" style="background:#d9d6ff"><div class="name">Fog</div><div class="hex">#D9D6FF</div></div>
<div class="swatch" style="background:#ffb777"><div class="name">Mac &amp; Cheese</div><div class="hex">#FFB777</div></div>
<div class="swatch" style="background:#ffb8e2"><div class="name">Cotton Candy</div><div class="hex">#FFB8E2</div></div>
</body></html>
