<form id="ef-lead-form" class="ef-lead-form" method="post" action="" data-ef-lead-source="site_demo_popup" novalidate>
  <div class="ef-lead-form__fields">
    <div class="ef-lead-form__field">
      <input class="ef-lead-form__input" type="text" name="Name" placeholder="Ваше имя" autocomplete="name" required />
    </div>
    <div class="ef-lead-form__field">
      <input class="ef-lead-form__input" type="text" name="Input" placeholder="Название компании" autocomplete="organization" required />
    </div>
    <div class="ef-lead-form__field">
      <input class="ef-lead-form__input" type="tel" name="Phone" placeholder="+7 (___) ___-__-__" autocomplete="tel" inputmode="tel" required />
    </div>
    <div class="ef-lead-form__field">
      <input class="ef-lead-form__input" type="email" name="Email" placeholder="Ваш Email" autocomplete="email" required />
    </div>
    <fieldset class="ef-lead-form__field ef-lead-form__modules" data-ef-demo-modules>
      <legend class="ef-lead-form__legend">Какие модули вас интересуют?</legend>
      <p class="ef-lead-form__modules-hint">Можно выбрать несколько</p>
      <div class="ef-lead-form__checks" data-ef-demo-modules-list role="group" aria-label="Модули платформы">
        <label class="ef-lead-form__chip ef-lead-form__chip--performance-review">
          <input type="checkbox" name="modules[]" value="performance-review" data-label="Performance Review" />
          <span>Performance Review</span>
        </label>
        <label class="ef-lead-form__chip ef-lead-form__chip--assessment-360">
          <input type="checkbox" name="modules[]" value="assessment-360" data-label="Оценка 360°" />
          <span>Оценка 360°</span>
        </label>
        <label class="ef-lead-form__chip ef-lead-form__chip--career-development">
          <input type="checkbox" name="modules[]" value="career-development" data-label="Карьера и развитие" />
          <span>Карьера и развитие</span>
        </label>
        <label class="ef-lead-form__chip ef-lead-form__chip--nine-box">
          <input type="checkbox" name="modules[]" value="nine-box" data-label="Матрица потенциала" />
          <span>Матрица потенциала</span>
        </label>
        <label class="ef-lead-form__chip ef-lead-form__chip--goal-setting">
          <input type="checkbox" name="modules[]" value="goal-setting" data-label="Целеполагание" />
          <span>Целеполагание</span>
        </label>
        <label class="ef-lead-form__chip ef-lead-form__chip--succession">
          <input type="checkbox" name="modules[]" value="succession" data-label="Планирование преемственности" />
          <span>Планирование преемственности</span>
        </label>
        <label class="ef-lead-form__chip ef-lead-form__chip--recognition">
          <input type="checkbox" name="modules[]" value="recognition" data-label="Нематериальная мотивация" />
          <span>Нематериальная мотивация</span>
        </label>
        <label class="ef-lead-form__chip ef-lead-form__chip--ai-assessment-assistant">
          <input type="checkbox" name="modules[]" value="ai-assessment-assistant" data-label="ИИ-ассистент оценки компетенций" />
          <span>ИИ-ассистент оценки компетенций</span>
        </label>
      </div>
    </fieldset>
    <fieldset class="ef-lead-form__field" style="border:0;padding:0;margin:0 0 16px;">
      <legend class="ef-lead-form__legend">Как с вами удобнее связаться?</legend>
      <div class="ef-lead-form__radios">
        <label class="ef-lead-form__radio"><input type="radio" name="Как с вами удобнее связаться?" value="Telegram" required /> Telegram</label>
        <label class="ef-lead-form__radio"><input type="radio" name="Как с вами удобнее связаться?" value="WhatsApp" /> WhatsApp</label>
        <label class="ef-lead-form__radio"><input type="radio" name="Как с вами удобнее связаться?" value="Звонок" /> Звонок</label>
      </div>
    </fieldset>
    <div class="ef-lead-form__field">
      <textarea class="ef-lead-form__textarea" name="Textarea" rows="2" placeholder="Коротко расскажите о своей задаче"></textarea>
    </div>
    <label class="ef-lead-form__check">
      <input type="checkbox" name="Checkbox" value="yes" required />
      <span>Я соглашаюсь с <a href="/privacy" target="_blank" rel="noopener">политикой конфиденциальности</a></span>
    </label>
    <div class="ef-lead-form__error" data-ef-error role="alert"></div>
  </div>
  <button class="ef-lead-form__submit" type="submit">Получить демодоступ</button>
  <div class="ef-lead-form__success" data-ef-success>
    <h3>Заявка отправлена</h3>
    <p>Спасибо! Менеджер свяжется с вами и предоставит демодоступ к платформе.</p>
  </div>
</form>
