<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EmplyFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* EF_LOADER_CSS_BEGIN */
    html, body {
      background:#050230 !important;
      color-scheme: dark;
      min-height:100vh;
      margin:0;
    }
    body { overflow:hidden; }
    #__bundler_thumbnail {
      position:fixed; inset:0; z-index:9999;
      display:grid; place-items:center;
      background:#050230;
    }
    .ef-loader-video {
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      background:#050230;
    }
    /* Persistent overlay during head/body swap (also styled inline in runtime JS). */
    #ef-enter-veil {
      position:fixed;
      inset:0;
      z-index:2147483647;
      background:#050230;
      pointer-events:auto;
    }
    @media (prefers-reduced-motion:reduce) {
      .ef-loader-video { object-fit:contain; }
    }
    /* EF_LOADER_CSS_END */
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <!-- EF_LOADER_HTML_BEGIN -->
  <div id="__bundler_thumbnail">
  <video id="__bundler_loader_video" class="ef-loader-video" autoplay muted playsinline preload="auto" poster="media/preloader-poster.jpg" aria-label="Загрузка EmplyFlow" data-loader-version="video-v2">
    <source src="media/preloader.webm" type="video/webm">
    <source src="media/preloader.mp4" type="video/mp4">
  </video>
</div>
  <!-- EF_LOADER_HTML_END -->

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }
  function wait(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); }

  function initLoaderVideo() {
    const video = document.getElementById('__bundler_loader_video');
    if (!video) return wait(600);
    video.muted = true;
    video.setAttribute('playsinline', '');
    var play = video.play();
    if (play && play.catch) play.catch(function() {});
    // Ролик низкодинамичный: показываем коротко и уходим на сайт,
    // не дожидаясь статичного хвоста видео (было ~3с стоп-кадра).
    return wait(1050);
  }
  var loaderPlayback = Promise.race([initLoaderVideo(), wait(2200)]);

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Готовим разделы сайта');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Скоро откроем главную');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    await loaderPlayback;

    // Антиблик: на записи был полный белый кадр (~130ms) в момент head/body
    // replaceWith — UA-стили дают белый body, пока CSS ещё не применился.
    // Держим ЖИВОЙ video-оверлей внутри body с полными inline-стилями и
    // переносим children head/body без replaceWith элементов — оверлей не
    // уничтожается ни на один кадр.
    function paintDark(el) {
      if (!el) return;
      el.style.setProperty('background', '#050230', 'important');
      el.style.setProperty('background-color', '#050230', 'important');
      el.style.setProperty('color-scheme', 'dark', 'important');
    }
    function rAF2() {
      return new Promise(function(resolve) {
        requestAnimationFrame(function() { requestAnimationFrame(resolve); });
      });
    }

    console.log('[bundle] loader swap video-v3');
    var htmlEl = document.documentElement;
    paintDark(htmlEl);
    paintDark(document.body);

    // Несъёмный boot-стиль прямо в <html>: даже если стили head на кадр
    // слетят при переносе, body/html останутся тёмными (страховка от белого).
    var bootHtmlStyle = document.getElementById('__ef_boot_style');
    if (!bootHtmlStyle) {
      bootHtmlStyle = document.createElement('style');
      bootHtmlStyle.id = '__ef_boot_style';
      bootHtmlStyle.textContent = 'html,body{background:#050230 !important;color-scheme:dark}';
      htmlEl.appendChild(bootHtmlStyle);
    }

    var thumb = document.getElementById('__bundler_thumbnail');
    var vid = document.getElementById('__bundler_loader_video');
    // Freeze последнего кадра как фон оверлея — если видео мигнёт при
    // переносе узлов, кадр всё равно перекрывает экран.
    var freezeUrl = '';
    try {
      if (vid) {
        try { vid.pause(); } catch (e1) {}
        if (vid.videoWidth) {
          var c = document.createElement('canvas');
          c.width = vid.videoWidth; c.height = vid.videoHeight;
          c.getContext('2d').drawImage(vid, 0, 0);
          freezeUrl = c.toDataURL('image/jpeg', 0.85);
        }
      }
    } catch (e) { /* tainted / no frame */ }
    if (vid) {
      vid.style.cssText = 'display:block;width:100%;height:100%;object-fit:cover;background:#050230;';
    }
    if (!thumb) {
      thumb = document.createElement('div');
      thumb.id = '__bundler_thumbnail';
      document.body.appendChild(thumb);
    }
    thumb.setAttribute('aria-hidden', 'true');
    thumb.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:block;margin:0;padding:0;border:0;background:#050230'
      + (freezeUrl ? ' center/cover no-repeat url("' + freezeUrl + '")' : '')
      + ';opacity:1;pointer-events:auto;transition:opacity .45s cubic-bezier(.16,1,.3,1);';
    // Оверлей обязан жить в body: children <html> вне head/body браузеры
    // часто не рисуют / переносят — отсюда был белый кадр.
    document.body.appendChild(thumb);
    await rAF2();

    var bootStyle = doc.createElement('style');
    bootStyle.textContent = 'html,body{background:#050230!important;color-scheme:dark;margin:0}';
    if (doc.head) doc.head.insertBefore(bootStyle, doc.head.firstChild);
    paintDark(doc.documentElement);
    paintDark(doc.body);

    // Атрибуты <html> без потери inline background.
    var keepBg = htmlEl.getAttribute('style');
    while (htmlEl.attributes.length) htmlEl.removeAttribute(htmlEl.attributes[0].name);
    for (var ai = 0; ai < doc.documentElement.attributes.length; ai++) {
      var attr = doc.documentElement.attributes[ai];
      htmlEl.setAttribute(attr.name, attr.value);
    }
    if (keepBg) htmlEl.setAttribute('style', keepBg);
    paintDark(htmlEl);

    // head: перенос children, сам элемент head не трогаем.
    var newHeadNodes = Array.from(doc.head.childNodes).map(function(n) {
      return document.adoptNode(n);
    });
    while (document.head.firstChild) document.head.removeChild(document.head.firstChild);
    for (var hi = 0; hi < newHeadNodes.length; hi++) {
      document.head.appendChild(newHeadNodes[hi]);
    }
    paintDark(htmlEl);
    paintDark(document.body);
    // Оверлей всё ещё в body с inline — белого кадра нет.
    if (thumb.parentNode !== document.body) document.body.appendChild(thumb);

    // body: перенос children, оверлей оставляем последним (сверху).
    var newBodyNodes = Array.from(doc.body.childNodes).map(function(n) {
      return document.adoptNode(n);
    });
    Array.from(document.body.childNodes).forEach(function(n) {
      if (n !== thumb) document.body.removeChild(n);
    });
    // Копируем атрибуты нового body
    Array.from(document.body.attributes).forEach(function(a) {
      document.body.removeAttribute(a.name);
    });
    for (var bi = 0; bi < doc.body.attributes.length; bi++) {
      var battr = doc.body.attributes[bi];
      document.body.setAttribute(battr.name, battr.value);
    }
    paintDark(document.body);
    for (var bj = 0; bj < newBodyNodes.length; bj++) {
      document.body.insertBefore(newBodyNodes[bj], thumb);
    }
    document.body.appendChild(thumb);
    await rAF2();

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    // Сайт собран под живым video-оверлеем — сразу открываем.
    await new Promise(function(resolve) {
      requestAnimationFrame(function() { requestAnimationFrame(resolve); });
    });
    var v = document.getElementById('__bundler_thumbnail');
    if (v) {
      document.body.appendChild(v);
      v.style.pointerEvents = 'none';
      v.style.opacity = '0';
      setTimeout(function() {
        if (v.parentNode) v.parentNode.removeChild(v);
        var bs = document.getElementById('__ef_boot_style');
        if (bs && bs.parentNode) bs.parentNode.removeChild(bs);
      }, 550);
    }

cial site-palette SVG.\n     Roles: Black Rock + Blue Ribbon are the workhorses.\n     The four pastels rotate as \"tile\" colors for cards/sections.\n     Cotton Candy is the accent highlight for callouts. */\n\n  --c-black-rock: #050230;         /* Deep navy — primary background */\n  --c-black-rock-2: #0a0540;       /* Slightly lifted */\n  --c-blue-ribbon: #4a3bff;        /* Primary action / brand indigo */\n  --c-blue-ribbon-deep: #3a2cf0;\n  --c-cotton-candy: #ffb8e2;       /* Pink accent — highlight text, dashed callouts */\n  --c-periwinkle: #cec8ff;         /* Lavender tile */\n  --c-fog: #d9d6ff;                /* Lighter lavender — surfaces, secondary text on dark */\n  --c-frosted-mint: #d5fff3;       /* Mint tile / brand-name highlight */\n  --c-mac-cheese: #ffb777;         /* Soft orange CTA + tile */\n  --c-cod-gray: #151515;           /* Near-black for dark-on-pastel */\n  --c-black: #000000;\n  --c-white: #ffffff;\n\n  /* ---- SEMANTIC SURFACES (dark theme, the brand default) ---------- */\n  --bg: var(--c-black-rock);\n  --bg-elevated: #0d0848;\n  --bg-glass: rgba(217, 214, 255, 0.06);\n  --bg-glass-strong: rgba(217, 214, 255, 0.10);\n\n  /* ---- SEMANTIC FOREGROUNDS --------------------------------------- */\n  --fg1: var(--c-white);           /* Primary text on dark */\n  --fg2: rgba(255, 255, 255, 0.72);/* Secondary */\n  --fg3: rgba(255, 255, 255, 0.48);/* Tertiary, captions */\n  --fg-mute: rgba(217, 214, 255, 0.32);\n\n  --fg-on-light: var(--c-cod-gray);\n  --fg-on-light-2: rgba(21, 21, 21, 0.66);\n\n  --fg-accent: var(--c-cotton-candy);\n  --fg-brand: var(--c-blue-ribbon);\n\n  /* ---- STROKES ----------------------------------------------------- */\n  --stroke: rgba(217, 214, 255, 0.12);\n  --stroke-strong: rgba(217, 214, 255, 0.22);\n  --stroke-dashed-accent: var(--c-cotton-candy);\n\n  /* ---- TYPE FAMILIES ---------------------------------------------- */\n  --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;\n  --font-display: 'Manrope', system-ui, sans-serif;\n  --font-mono: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;\n\n  /* ---- TYPE SCALE (1920 baseline; scales fine via clamp on web) --- */\n  --fs-hero:   clamp(56px, 7vw, 128px);  /* @kind font */ /* Massive brand title */\n  --fs-h1:     clamp(40px, 4.5vw, 76px); /* @kind font */ /* Section heroes */\n  --fs-h2:     clamp(32px, 3vw, 52px);   /* @kind font */ /* Card titles, big stats */\n  --fs-h3:     clamp(22px, 1.6vw, 28px); /* @kind font */ /* Sub-headings */\n  --fs-h4:     20px;   /* @kind font */\n  --fs-body-l: 20px;   /* @kind font */\n  --fs-body:   17px;   /* @kind font */\n  --fs-body-s: 15px;   /* @kind font */\n  --fs-caption:13px;   /* @kind font */\n  --fs-eyebrow:12px;   /* @kind font */\n\n  /* ---- LINE HEIGHT / TRACKING ------------------------------------- */\n  --lh-tight: 1.02;  /* @kind font */\n  --lh-snug:  1.12;  /* @kind font */\n  --lh-base:  1.45;  /* @kind font */\n  --lh-loose: 1.6;   /* @kind font */\n\n  --tr-tight: -0.02em;   /* @kind font */\n  --tr-base:   0em;      /* @kind font */\n  --tr-eyebrow: 0.12em;  /* @kind font */\n\n  --fw-light: 300;  /* @kind font */\n  --fw-reg: 400;    /* @kind font */\n  --fw-med: 500;    /* @kind font */\n  --fw-semi: 600;   /* @kind font */\n  --fw-bold: 700;   /* @kind font */\n  --fw-black: 800;  /* @kind font */\n\n  /* ---- SPACING SCALE (4px base) ----------------------------------- */\n  --s-1: 4px;\n  --s-2: 8px;\n  --s-3: 12px;\n  --s-4: 16px;\n  --s-5: 24px;\n  --s-6: 32px;\n  --s-7: 48px;\n  --s-8: 64px;\n  --s-9: 96px;\n  --s-10: 128px;\n\n  /* ---- RADII — rounded but tactile -------------------------------- */\n  --r-xs: 8px;\n  --r-sm: 14px;\n  --r-md: 20px;\n  --r-lg: 28px;\n  --r-xl: 40px;\n  --r-2xl: 56px;\n  --r-pill: 999px;\n\n  /* ---- SHADOWS ----------------------------------------------------- */\n  --shadow-card: 0 2px 0 rgba(0,0,0,0.04), 0 24px 60px -20px rgba(5,2,48,0.55);\n  --shadow-glow-indigo: 0 0 80px -10px rgba(74,59,255,0.55);\n  --shadow-glow-pink:   0 0 80px -10px rgba(255,184,226,0.45);\n\n  /* ---- MOTION ------------------------------------------------------ */\n  --ease-out: cubic-bezier(.2,.7,.2,1);     /* @kind other */\n  --ease-in-out: cubic-bezier(.7,0,.2,1);   /* @kind other */\n  --t-fast: 150ms;   /* @kind other */\n  --t-base: 240ms;   /* @kind other */\n  --t-slow: 420ms;   /* @kind other */\n}\n\n/* =============================================================\n   SEMANTIC CLASSES — drop on elements directly\n   ============================================================= */\n\nhtml, body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-base);\n  color: var(--fg1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n}\n\n.h-hero {\n  font-family: var(--font-display);\n  font-size: var(--fs-hero);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.03em;\n}\n.h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n}\n.h2 {\n  font-size: var(--fs-h2);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n}\n.h3 {\n  font-size: var(--fs-h3);\n  font-weight: var(--fw-semi);\n  line-height: 1.25;\n}\n.h4 { font-size: var(--fs-h4); font-weight: var(--fw-semi); }\n\n.body-l { font-size: var(--fs-body-l); line-height: var(--lh-base); }\n.body   { font-size: var(--fs-body);   line-height: var(--lh-base); }\n.body-s { font-size: var(--fs-body-s); line-height: var(--lh-base); }\n\n.caption {\n  font-size: var(--fs-caption);\n  color: var(--fg3);\n  line-height: 1.4;\n}\n.eyebrow {\n  font-size: var(--fs-eyebrow);\n  letter-spacing: var(--tr-eyebrow);\n  text-transform: uppercase;\n  font-weight: var(--fw-semi);\n  color: var(--fg2);\n}\n\n.t-mint   { color: var(--c-frosted-mint); }\n.t-pink   { color: var(--c-cotton-candy); }\n.t-indigo { color: var(--c-blue-ribbon); }\n.t-fog    { color: var(--c-fog); }\n.t-orange { color: var(--c-mac-cheese); }\n<\u002Fstyle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"8bc7ebdf-0a25-4785-9d07-e3518000043e\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"e4fe782c-675d-4d36-ac36-5b8f0f644fb1\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"837f114a-c071-448d-bf85-cd34951760e6\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"2c6808af-900c-4827-9b17-10026cebdd47\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"106489ca-b4a3-4147-90c2-ba634414b399\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  fon 20, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"0cc39c19-19d4-4b03-a96a-06efee6364a5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html,body{margin:0;padding:0;background:#050230;color:#fff;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}\n  *{box-sizing:border-box;}\n  img,svg{display:block;max-width:100%;}\n  button{font-family:inherit;}\n  a{color:#cec8ff;text-decoration:none;}\n  a:hover{color:#ffffff;}\n  @keyframes efFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}\n  @keyframes efFloat2{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(-8deg)}}\n<\u002Fstyle>\n<style>\n  /* ===== Первый экран: HRM-платформа ... на базе ИИ ===== */\n  .ef-hero{position:relative;padding:clamp(40px,6vw,86px) clamp(16px,4vw,40px) clamp(40px,5vw,72px);overflow:hidden;}\n  /* подсветка держится в зоне заголовка, чтобы не подсвечивать фон под роликом и не давать стык */\n  .ef-hero__bloom{position:absolute;left:0;right:0;top:0;height:clamp(300px,46vw,620px);background:radial-gradient(58% 100% at 4% 30%,rgba(74,59,255,0.42) 0%,transparent 66%);pointer-events:none;}\n  .ef-hero__scribble{position:absolute;opacity:0.5;pointer-events:none;}\n  .ef-hero__scribble--1{top:clamp(28px,5vw,74px);left:clamp(96px,17vw,270px);width:clamp(52px,6vw,90px);}\n  .ef-hero__scribble--2{top:clamp(150px,20vw,270px);left:clamp(150px,26vw,400px);width:clamp(44px,5vw,74px);transform:rotate(168deg);}\n  .ef-hero__arrow3d{position:absolute;left:clamp(-24px,1.4vw,44px);top:clamp(200px,26vw,320px);width:clamp(112px,16vw,245px);animation:efFloat2 7s ease-in-out infinite;filter:drop-shadow(0 24px 50px rgba(74,59,255,.55));pointer-events:none;}\n  .ef-hero__star{position:absolute;right:clamp(6vw,14vw,200px);top:clamp(150px,20vw,260px);width:clamp(74px,10vw,150px);animation:efFloat 8s ease-in-out infinite;pointer-events:none;}\n\n  .ef-hero__inner{position:relative;max-width:1200px;margin:0 auto;}\n  .ef-hero__title{max-width:1000px;margin:0 auto;font-weight:800;font-size:clamp(27px,4.1vw,56px);line-height:0.98;letter-spacing:-0.032em;text-align:center;color:#fff;}\n  /* левый край плашки стоит по центру заголовка — как на сайте */\n  .ef-hero__callout-row{display:grid;grid-template-columns:1fr 1fr;margin-top:clamp(18px,2.6vw,34px);}\n  .ef-hero__callout{grid-column:2;justify-self:start;border:1.6px dashed #ffb8e2;border-radius:20px;padding:clamp(6px,0.9vw,14px) clamp(14px,1.9vw,28px);font-weight:800;font-size:clamp(23px,3.2vw,42px);line-height:1;letter-spacing:-0.03em;color:#ffb8e2;white-space:nowrap;}\n\n  .ef-hero__lead{max-width:440px;margin:clamp(28px,4vw,60px) auto 0;font-size:clamp(14px,1.25vw,16px);font-weight:600;line-height:1.4;text-align:center;color:#d9d6ff;}\n  .ef-hero__cta{display:flex;justify-content:center;margin-top:clamp(20px,2.6vw,32px);}\n  .ef-btn{display:inline-flex;align-items:center;gap:12px;border-radius:999px;font-size:15px;font-weight:600;transition:filter 150ms,box-shadow 150ms;}\n  .ef-btn--indigo{background:#4a3bff;color:#fff;padding:9px 30px 9px 9px;}\n  .ef-btn--indigo:hover{color:#fff;filter:brightness(1.09);}\n  .ef-btn__ic{display:grid;place-items:center;width:38px;height:38px;border-radius:999px;background:#fff;color:#4a3bff;}\n\n  .ef-hero__award{position:absolute;right:0;top:clamp(180px,22vw,280px);width:clamp(158px,16vw,215px);height:auto;}\n\n  /* фон ролика совпадает с canvas Black Rock, поэтому рамка не нужна — он читается как часть страницы */\n  .ef-hero__anim{position:relative;margin:clamp(18px,2.6vw,40px) auto 0;max-width:1180px;}\n  /* верхний край растворяем — там ролик встречается с подсветкой заголовка */\n  .ef-hero__anim video{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 6%);mask-image:linear-gradient(to bottom,transparent 0,#000 6%);}\n  /* на узком экране и при отключённой анимации показываем стоп-кадр: мелкий текст в ролике всё равно не читается */\n  @media (prefers-reduced-motion:reduce),(max-width:700px){\n    .ef-hero__anim video{display:none;}\n    .ef-hero__anim{aspect-ratio:16/9;background:url(\"media/hero-animation-poster.jpg\") center/contain no-repeat;}\n  }\n\n  .ef-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,24px);align-items:end;margin-top:clamp(34px,4.6vw,70px);}\n  .ef-card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:clamp(10px,1.2vw,16px);border-radius:30px;padding:clamp(18px,2vw,30px);color:#151515;}\n  .ef-card--mint{background:#d5fff3;min-height:clamp(150px,14vw,200px);}\n  .ef-card--peri{background:#cec8ff;min-height:clamp(170px,16vw,230px);}\n  .ef-card--pink{background:#ffb8e2;min-height:clamp(190px,18vw,260px);}\n  .ef-card__title{max-width:14ch;font-weight:800;font-size:clamp(19px,2.2vw,28px);line-height:1.02;letter-spacing:-0.025em;}\n  .ef-card__body{font-size:clamp(12.5px,1.15vw,15px);font-weight:500;line-height:1.35;color:rgba(21,21,21,0.82);}\n  .ef-card__sparkle{position:absolute;pointer-events:none;}\n\n  @media (max-width:900px){\n    .ef-hero{padding-top:clamp(28px,6vw,48px);}\n    .ef-hero__scribble,.ef-hero__star{display:none;}\n    .ef-hero__arrow3d{position:static;margin:clamp(18px,4vw,28px) auto 0;width:clamp(88px,22vw,130px);}\n    .ef-hero__callout-row{grid-template-columns:1fr;justify-items:center;}\n    .ef-hero__callout{grid-column:1;justify-self:center;}\n    .ef-hero__award{position:static;display:block;margin:clamp(24px,5vw,34px) auto 0;width:clamp(168px,46vw,210px);}\n    .ef-cards{grid-template-columns:1fr;align-items:stretch;}\n    .ef-card{min-height:0;}\n    .ef-card__title{max-width:none;}\n  }\n<\u002Fstyle>\n<style>\n  /* ===== Benefit tiles: падение / всплытие по скроллу ===== */\n  .ef-benefits{padding:0 clamp(16px,4vw,40px) clamp(40px,6vw,70px);}\n  .ef-benefits__grid{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}\n\n  .ef-benefit{position:relative;overflow:hidden;border-radius:32px;min-height:clamp(300px,34vw,440px);box-shadow:0 28px 64px -28px rgba(5,2,48,0.72);}\n  .ef-benefit__sparkle{position:absolute;pointer-events:none;}\n  .ef-benefit__title{font-weight:800;font-size:clamp(26px,3.4vw,44px);line-height:1.05;letter-spacing:-0.02em;}\n\n  .ef-benefit--lilac{background:#7b46ff;padding:clamp(28px,3vw,40px);display:flex;align-items:center;box-shadow:0 28px 64px -28px rgba(5,2,48,0.72),0 0 72px -24px rgba(123,70,255,0.55);}\n  .ef-benefit--lilac .ef-benefit__sparkle{top:36px;left:34px;width:26px;height:26px;fill:#ffcf8a;}\n  .ef-benefit--lilac .ef-benefit__title{color:#fff;}\n\n  .ef-benefit--photo{background:linear-gradient(180deg,#ffd3e0 0%,#d9fff0 100%);display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 28px 64px -28px rgba(5,2,48,0.72),0 0 68px -26px rgba(213,255,243,0.42);}\n  .ef-benefit--photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;}\n  .ef-benefit__caption{position:relative;padding:clamp(20px,2.4vw,30px);text-align:center;font-weight:800;font-size:clamp(20px,2.4vw,30px);letter-spacing:-0.02em;color:#0e2b25;background:linear-gradient(180deg,transparent,rgba(217,255,240,0.9) 42%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}\n\n  .ef-benefit--orange{background:#ff6a2b;padding:clamp(28px,3vw,40px);display:flex;align-items:center;box-shadow:0 28px 64px -28px rgba(5,2,48,0.72),0 0 72px -24px rgba(255,106,43,0.5);}\n  .ef-benefit--orange .ef-benefit__sparkle{top:40px;left:32px;width:22px;height:22px;fill:#ffe1cf;}\n  .ef-benefit--orange .ef-benefit__title{color:#fff;}\n\n  @keyframes efBenefitDrop{from{opacity:0;transform:translateY(-152px);}to{opacity:1;transform:none;}}\n  @keyframes efBenefitRise{from{opacity:0;transform:translateY(152px);}to{opacity:1;transform:none;}}\n\n  .ef-benefit{transition:opacity 0.92s cubic-bezier(.22,1,.36,1),transform 0.92s cubic-bezier(.22,1,.36,1);}\n  .ef-benefits--animate .ef-benefit--drop:not(.is-visible){opacity:0;transform:translateY(-152px);}\n  .ef-benefits--animate .ef-benefit--rise:not(.is-visible){opacity:0;transform:translateY(152px);}\n\n  @supports (animation-timeline:view()){\n    @media (prefers-reduced-motion:no-preference){\n      .ef-benefits:not(.ef-benefits--animate) .ef-benefit--drop{animation:efBenefitDrop linear both;animation-timeline:view();animation-range:entry 0% cover 32%;}\n      .ef-benefits:not(.ef-benefits--animate) .ef-benefit--rise{animation:efBenefitRise linear both;animation-timeline:view();animation-range:entry 0% cover 32%;}\n    }\n  }\n<\u002Fstyle>\n<style>\n  /* ===== Кейсы: визуальные карточки с AI-иллюстрациями ===== */\n  .ef-cases{padding:clamp(40px,5vw,70px) clamp(16px,4vw,40px) clamp(56px,8vw,100px);}\n  .ef-cases__inner{max-width:1360px;margin:0 auto;}\n  .ef-cases__head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:clamp(28px,4vw,48px);}\n  .ef-cases__title{font-weight:800;font-size:clamp(34px,5.2vw,72px);line-height:1;letter-spacing:-0.03em;color:#fff;margin:0;}\n  .ef-cases__lead{flex:0 1 460px;font-size:clamp(15px,1.5vw,19px);line-height:1.45;color:rgba(255,255,255,0.8);margin:0;}\n  .ef-cases__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;}\n  .ef-case{position:relative;isolation:isolate;overflow:hidden;text-decoration:none;border-radius:32px;padding:clamp(26px,2.8vw,34px);min-height:clamp(300px,30vw,380px);display:flex;flex-direction:column;justify-content:space-between;background:var(--case-bg);color:var(--case-color);box-shadow:0 28px 70px -32px rgba(5,2,48,0.92);transition:transform 420ms cubic-bezier(.16,1,.3,1),box-shadow 420ms cubic-bezier(.16,1,.3,1);}\n  .ef-case::before{content:\"\";position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.02) 0%,rgba(255,255,255,0.03) 30%,var(--case-bg) 62%,var(--case-bg) 100%);}\n  .ef-case::after{content:\"\";position:absolute;z-index:1;inset:0;background:radial-gradient(72% 54% at 82% 4%,rgba(255,255,255,0.28),transparent 64%);opacity:0.75;pointer-events:none;}\n  .ef-case:hover{transform:translateY(-8px);box-shadow:0 38px 90px -34px rgba(5,2,48,0.98);}\n  .ef-case__visual{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 620ms cubic-bezier(.16,1,.3,1),opacity 420ms;}\n  .ef-case:hover .ef-case__visual{transform:scale(1.1);}\n  .ef-case--dark .ef-case__visual{opacity:0.72;mix-blend-mode:screen;}\n  .ef-case--light .ef-case__visual{opacity:0.5;mix-blend-mode:multiply;}\n  .ef-case__arrow,.ef-case__content{position:relative;z-index:2;}\n  .ef-case__arrow{display:flex;justify-content:flex-end;}\n  .ef-case__name{font-size:clamp(20px,2.1vw,26px);font-weight:800;line-height:1.15;letter-spacing:-0.02em;margin-bottom:14px;}\n  .ef-case__body{font-size:14.5px;line-height:1.5;color:var(--case-body);}\n  @media (prefers-reduced-motion:reduce){\n    .ef-case,.ef-case__visual{transition:none;}\n    .ef-case:hover{transform:none;}\n  }\n<\u002Fstyle>\n<style>\n  /* ===== Этапы внедрения: glass-карточки на светящемся фоне ===== */\n  .ef-impl{position:relative;overflow:hidden;padding:clamp(48px,6vw,90px) clamp(16px,4vw,40px) clamp(60px,9vw,120px);}\n  .ef-impl__glow{position:absolute;border-radius:999px;filter:blur(60px);opacity:0.72;pointer-events:none;}\n  .ef-impl__glow--indigo{left:-8%;top:4%;width:clamp(280px,44vw,660px);height:clamp(200px,28vw,400px);background:radial-gradient(closest-side,rgba(74,59,255,0.62),transparent);animation:efDrift 22s ease-in-out infinite;}\n  .ef-impl__glow--pink{right:-6%;top:32%;width:clamp(230px,34vw,520px);height:clamp(190px,25vw,360px);background:radial-gradient(closest-side,rgba(255,184,226,0.4),transparent);animation:efDrift 27s ease-in-out infinite reverse;}\n  .ef-impl__glow--mint{left:32%;bottom:-8%;width:clamp(200px,28vw,440px);height:clamp(170px,21vw,320px);background:radial-gradient(closest-side,rgba(213,255,243,0.26),transparent);animation:efDrift 33s ease-in-out infinite;}\n\n  .ef-impl__inner{position:relative;max-width:1360px;margin:0 auto;}\n  .ef-impl__eyebrow,.ef-impl__title{transition:opacity 0.82s cubic-bezier(.16,1,.3,1),transform 0.82s cubic-bezier(.16,1,.3,1);}\n  .ef-impl--animate .ef-impl__eyebrow:not(.is-visible),.ef-impl--animate .ef-impl__title:not(.is-visible){opacity:0;transform:translateY(28px);}\n  .ef-impl__eyebrow{display:block;margin:0 auto clamp(14px,1.6vw,20px);font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-align:center;color:rgba(217,214,255,0.6);}\n  .ef-impl__title{max-width:960px;margin:0 auto clamp(34px,4.6vw,64px);font-weight:800;font-size:clamp(28px,4.4vw,56px);line-height:1.06;letter-spacing:-0.03em;text-align:center;color:#fff;}\n\n  .ef-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,26px);}\n  /* каскад: каждая следующая колонка ниже предыдущей */\n  .ef-steps>*:nth-child(3n+2){margin-top:clamp(14px,2.2vw,38px);}\n  .ef-steps>*:nth-child(3n){margin-top:clamp(28px,4.4vw,76px);}\n\n  .ef-step-wrap{display:flex;transition:opacity 0.88s cubic-bezier(.16,1,.3,1),transform 0.88s cubic-bezier(.16,1,.3,1),filter 0.88s cubic-bezier(.16,1,.3,1);}\n  .ef-impl--animate .ef-step-wrap:not(.is-visible){opacity:0;transform:translateY(56px) scale(0.94);filter:blur(10px);}\n  .ef-impl--animate .ef-step-wrap.is-visible .ef-step__sheen{animation:efSheen 0.95s cubic-bezier(.16,1,.3,1) both;animation-delay:0.22s;}\n  .ef-step{--ef-accent:#cec8ff;--ef-glow:rgba(206,200,255,0.5);--ef-tint:rgba(206,200,255,0.16);position:relative;isolation:isolate;overflow:hidden;flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(16px,1.8vw,26px);padding:clamp(18px,2.1vw,28px);border-radius:clamp(22px,2.4vw,32px);border:1px solid rgba(217,214,255,0.2);background:linear-gradient(158deg,var(--ef-tint),rgba(217,214,255,0.04));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 26px 60px -26px rgba(5,2,48,0.9),inset 0 1px 0 rgba(255,255,255,0.07);transition:transform 320ms cubic-bezier(.2,.7,.2,1),border-color 320ms,box-shadow 320ms;}\n  /* акцентное свечение внутри стекла */\n  .ef-step::before{content:\"\";position:absolute;z-index:-1;top:-46%;left:-22%;width:92%;height:104%;border-radius:999px;background:radial-gradient(closest-side,var(--ef-glow),transparent);filter:blur(22px);opacity:0.7;animation:efGlowPulse 9s ease-in-out infinite;}\n  /* светящаяся кромка сверху */\n  .ef-step::after{content:\"\";position:absolute;top:0;left:10%;right:10%;height:1.5px;background:linear-gradient(90deg,transparent,var(--ef-accent),transparent);opacity:0.9;}\n  .ef-step:hover{transform:translateY(-8px);border-color:rgba(217,214,255,0.34);box-shadow:0 34px 74px -26px rgba(5,2,48,0.95),0 0 70px -20px var(--ef-glow);}\n\n  .ef-step-wrap:nth-child(1) .ef-step{--ef-accent:#4a3bff;--ef-glow:rgba(74,59,255,0.62);--ef-tint:rgba(74,59,255,0.24);}\n  .ef-step-wrap:nth-child(2) .ef-step{--ef-accent:#ffb777;--ef-glow:rgba(255,183,119,0.5);--ef-tint:rgba(255,183,119,0.18);}\n  .ef-step-wrap:nth-child(3) .ef-step{--ef-accent:#d5fff3;--ef-glow:rgba(213,255,243,0.55);--ef-tint:rgba(213,255,243,0.15);}\n  .ef-step-wrap:nth-child(4) .ef-step{--ef-accent:#cec8ff;--ef-glow:rgba(206,200,255,0.5);--ef-tint:rgba(206,200,255,0.17);}\n  .ef-step-wrap:nth-child(5) .ef-step{--ef-accent:#ffb8e2;--ef-glow:rgba(255,184,226,0.5);--ef-tint:rgba(255,184,226,0.17);}\n  .ef-step-wrap:nth-child(6) .ef-step{--ef-accent:#d9d6ff;--ef-glow:rgba(217,214,255,0.55);--ef-tint:rgba(217,214,255,0.15);}\n\n  .ef-step-wrap:nth-child(2) .ef-step::before{animation-delay:-1.5s;}\n  .ef-step-wrap:nth-child(3) .ef-step::before{animation-delay:-3s;}\n  .ef-step-wrap:nth-child(4) .ef-step::before{animation-delay:-4.5s;}\n  .ef-step-wrap:nth-child(5) .ef-step::before{animation-delay:-6s;}\n  .ef-step-wrap:nth-child(6) .ef-step::before{animation-delay:-7.5s;}\n\n  .ef-step__top{display:flex;align-items:center;gap:12px;}\n  .ef-step__num{display:inline-flex;align-items:center;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.06em;color:var(--ef-accent);background:rgba(5,2,48,0.34);box-shadow:inset 0 0 0 1px var(--ef-glow),0 0 26px -12px var(--ef-glow);}\n  .ef-step__title{font-weight:800;font-size:clamp(18px,1.9vw,24px);line-height:1.14;letter-spacing:-0.02em;color:#fff;}\n  .ef-step__body{margin-top:clamp(8px,0.9vw,12px);font-size:clamp(12.5px,1.05vw,14px);line-height:1.5;color:rgba(255,255,255,0.7);}\n\n  .ef-step__sheen{position:absolute;top:0;bottom:0;left:0;width:44%;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.14),transparent);opacity:0;pointer-events:none;}\n\n  @keyframes efDrift{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(4%,-5%,0) scale(1.1);}}\n  @keyframes efGlowPulse{0%,100%{opacity:0.42;}50%{opacity:0.9;}}\n  @keyframes efStepIn{from{opacity:0;transform:translateY(44px) scale(0.97);}to{opacity:1;transform:none;}}\n  @keyframes efSheen{0%{opacity:0;transform:translateX(-120%) skewX(-14deg);}35%{opacity:1;}100%{opacity:0;transform:translateX(150%) skewX(-14deg);}}\n\n  /* fallback без JS */\n  @supports (animation-timeline:view()){\n    @media (prefers-reduced-motion:no-preference){\n      .ef-impl:not(.ef-impl--animate) .ef-step-wrap{animation:efStepIn linear both;animation-timeline:view();animation-range:entry 6% cover 34%;}\n      .ef-impl:not(.ef-impl--animate) .ef-step__sheen{animation:efSheen linear both;animation-timeline:view(); benefit ef-benefit--orange ef-benefit--drop\">\n        <svg class=\"ef-benefit__sparkle\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 0L13.5 10.5 24 12 13.5 13.5 12 24 10.5 13.5 0 12 10.5 10.5z\"><\u002Fpath><\u002Fsvg>\n        <div class=\"ef-benefit__title\">Повышение вовлечённости и уровня достижения целей на 10–15%<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== MODULES (product cards) ===================== -->\n  <style>\n  @keyframes efModFeed{0%,100%{transform:translateX(0);opacity:.72}45%{transform:translateX(4px);opacity:1}}\n  @keyframes efModFlow{to{stroke-dashoffset:-36}}\n  @keyframes efModPulse{0%{transform:scale(.92);opacity:.55}70%{transform:scale(1.55);opacity:0}100%{opacity:0}}\n  @keyframes efModBar{0%,100%{width:var(--w0,40%)}55%{width:var(--w1,86%)}}\n  .ef-mods{position:relative;overflow:hidden;padding:clamp(56px,8vw,110px) clamp(16px,4vw,40px);}\n  .ef-mods__bloom{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 55% at 12% -8%,rgba(74,59,255,.38),transparent 66%),radial-gradient(40% 40% at 92% 18%,rgba(255,184,226,.18),transparent 70%);}\n  .ef-mods__inner{position:relative;z-index:1;max-width:1360px;margin:0 auto;}\n  .ef-mods__head{max-width:860px;margin:0 0 clamp(28px,4vw,48px);}\n  .ef-mods__eyebrow{display:inline-flex;align-items:center;gap:9px;margin:0 0 14px;color:var(--c-fog);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}\n  .ef-mods__eyebrow::before{content:\"\";width:7px;height:7px;border-radius:50%;background:var(--c-blue-ribbon);box-shadow:0 0 0 4px rgba(74,59,255,.22);}\n  .ef-mods__title{margin:0 0 14px;font-weight:800;font-size:clamp(28px,4vw,52px);line-height:1.04;letter-spacing:-.03em;color:#fff;text-wrap:balance;}\n  .ef-mods__title span{color:var(--c-cotton-candy);}\n  .ef-mods__lead{margin:0;max-width:640px;font-size:clamp(15px,1.4vw,18px);line-height:1.5;color:rgba(217,214,255,.78);}\n  .ef er;justify-content:center;padding:clamp(22px,2.6vw,34px);background:radial-gradient(120% 120% at 82% 0%,#efeafe,#e1daf8);}\n  .ef-mod__win{width:100%;max-width:490px;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #ececf6;box-shadow:0 28px 56px -26px rgba(5,2,48,.5);transition:transform .55s cubic-bezier(.2,.7,.2,1);}\n  .ef-mod:hover .ef-mod__win{transform:scale(1.03) translateY(-5px);}\n  .ef-mod__bar{height:36px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#f6f6fa;border-bottom:1px solid #edecf3;}\n  .ef-mod__dot{width:9px;height:9px;border-radius:50%;background:#e0e0ea;}\n  .ef-mod__bar-title{margin-left:8px;font-size:11px;font-weight:700;color:#8681ab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .ef-mod__body{padding:14px;}\n  .ef-mod__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}\n  .ef-mod--tile .ef-mod__panel{height:188px;padding:18px 18px 0;overflow:hidden;align-items:flex-start;}\n  .ef-mod--tile .ef-mod__win{max-width:none;border-radius:13px 13px 0 0;border-bottom:0;box-shadow:0 18px 34px -20px rgba(5,2,48,.35);}\n  .ef-mod--tile .ef-mod__bar{height:28px;}\n  .ef-mod--tile .ef-mod__dot{width:7px;height:7px;}\n  .ef-mod--tile .ef-mod__bar-title{font-size:10px;}\n  .ef-mod--tile .ef-mod__copy{padding:18px 22px 22px;flex:1;}\n  .ef-mod__lbl{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;color:var(--c-blue-ribbon);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}\n  .ef-mod__lbl i{width:14px;height:14px;border-radius:4px;background:var(--c-blue-ribbon);opacity:.9;}\n  .ef-mod__ttl{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#141033;}\n  .ef-mod__desc{margin:0;font-size:14px;line-height:1.5;color:#5b567e;}\n  .ef-mod__go{margin-top:auto;padding-top:16px;display:inline-flex;align-items:center;gap:6px;color:var(--c-blue-ribbon);font-weight:700;font-size:14px;text-decoration:none;}\n  .ef-mod__go:hover{color:var(--c-blue-ribbon);}\n  .ef-mod--mint .ef-mod__panel{background:radial-gradient(120% 120% at 72% 0%,#eef7e4,#e2efd0);}\n  .ef-mod--peri .ef-mod__panel{background:radial-gradient(120% 120% at 72% 0%,#efeafe,#e4defb);}\n  .ef-mod--pink .ef-mod__panel{background:radial-gradient(120% 120% at 72% 0%,#fdeaf3,#f6d8ea);}\n  .ef-mod--fog .ef-mod__panel{background:radial-gradient(120% 120% at 72% 0%,#ecefff,#dde4fb);}\n  .ef-mod--mint2 .ef-mod__panel{background:radial-gradient(120% 120% at 72% 0%,#e6f7f1,#d4efe6);}\n  .ef-mod--pink2 .ef-mod__panel{background:radial-gradient(120% 120% at 72% 0%,#fdeaf5,#f8d6ea);}\n  .ef-ui-src{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#f5f4fb;border:1px solid #ececf6;font-size:11px;font-weight:700;color:#403c68;animation:efModFeed 4.4s ease-in-out infinite;}\n  .ef-ui-src:nth-child(2){animation-delay:.25s}.ef-ui-src:nth-child(3){animation-delay:.5s}.ef-ui-src:nth-child(4){animation-delay:.75s}\n  .ef-ui-src b{width:14px;height:14px;border-radius:4px;flex:none;}\n  .ef-ui-src em{margin-left:auto;font-style:normal;color:#8681ab;font-variant-numeric:tabular-nums;}\n  .ef-ui-score{width:78px;height:78px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(160deg,#141414,#242424);color:#c6e94b;font-size:42px;font-weight:800;box-shadow:0 14px 30px -12px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.7,.2,1);}\n  .ef-mod:hover .ef-ui-score{transform:scale(1.06);}\n  .ef-ui-meter{height:7px;border-radius:999px;background:#edecf4;overflow:hidden;}\n  .ef-ui-meter > i{display:block;height:100%;border-radius:inherit;background:var(--c-blue-ribbon);}\n  .ef-ui-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;font-weight:700;color:#403c68;margin-bottom:4px;}\n  .ef-ui-pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;}\n  @media (max-width:980px){\n    .ef-mod  <a class=\"ef-mod__btn ef-mod__btn--primary\" href=\"#contacts\">Получить демодоступ<\u002Fa>\n            <a class=\"ef-mod__btn ef-mod__btn--ghost\" href=\"#aboutus\">Как это работает <svg class=\"ef-mod__arw\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ef-mod__panel\" aria-hidden=\"true\">\n          <div class=\"ef-mod__win\" role=\"img\" aria-label=\"Сводка Performance Review: цели, KPI, 360 и компетенции сходятся в балл B\">\n            <div class=\"ef-mod__bar\">\n              <span class=\"ef-mod__dot\"><\u002Fspan><span class=\"ef-mod__dot\"><\u002Fspan><span class=\"ef-mod__dot\"><\u002Fspan>\n              <span class=\"ef-mod__bar-title\">PR · Анна Ковалёва · Product · Q2’26<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"ef-mod__body\" style=\"display:grid;grid-template-columns:1.15fr 72px 112px;gap:8px;align-items:center;min-height:250px;\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;\">\n                  <span style=\"font-size:10px;font-weight:800;color:#8681ab;letter-spacing:.06em;text-transform:uppercase;\">Источники оценки<\u002Fspan>\n                  <span class=\"ef-ui-pill\" style=\"background:#eef2ff;color:#4a3bff;\">4 сигнала<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"ef-ui-src\"><b style=\"background:#4a3bff\"><\u002Fb>Цели OKR<em>54%<\u002Fem><\u002Fdiv>\n                <div class=\"ef-ui-src\"><b style=\"background:#c6e94b\"><\u002Fb>KPI отдела<em>83%<\u002Fem><\u002Fdiv>\n                <div class=\"ef-ui-src\"><b style=\"background:#5fce87\"><\u002Fb>Оценка 360°<em>4.1<\u002Fem><\u002Fd rEach((el) => el.classList.add('is-visible'));\n        items.forEach((el) => el.classList.add('is-visible'));\n        return;\n      }\n\n      section.classList.add(animateClass);\n      const obs = new IntersectionObserver(\n        (entries) => {\n          entries.forEach((entry) => {\n            if (!entry.isIntersecting) return;\n            let delay = 0;\n            headers.forEach((el) => {\n              this._revealTimers.push(setTimeout(() => el.classList.add('is-visible'), delay));\n              delay += opts.headerGap || 100;\n            });\n            if (headers.length) delay += opts.afterHeader || 120;\n            items.forEach((el, i) => {\n              this._revealTimers.push(setTimeout(() => el.classList.add('is-visible'), delay + i * staggerMs));\n            });\n            obs.disconnect();\n          });\n        },\n        opts.observer || { threshold: 0.1, rootMargin: '0px 0px -5% 0px' },\n      );\n      obs.observe(section);\n      this._revealObs.push(obs);\n    };\n\n    const benefits = document.querySelector('.ef-benefits');\n    reveal(\n      benefits,\n      Array.from(benefits?.querySelectorAll('.ef-benefit') || []),\n      'ef-benefits--animate',\n      400,\n      { observer: { threshold: 0.12, rootMargin: '0px 0px -4% 0px' } },\n    );\n\n    const impl = document.querySelector('.ef-impl');\n    reveal(\n      impl,\n      Array.from(impl?.querySelectorAll('.ef-step-wrap') || []),\n      'ef-impl--animate',\n      140,\n      {\n        headers: [impl?.querySelector('.ef-impl__eyebrow'), impl?.querySelector('.ef-impl__title')],\n        headerGap: 90,\n        afterHeader: 160,\n      },\n    );\n  }\n\n  renderVals() {\n    const closeMenu = () => this.setState({ menuOpen: false });\n    const navDefs = [\n      ['Модули системы', '#platform'], ['О нас', '#aboutus'], ['Интеграции', '#stages'],\n      ['Библиотека', 'https://emplyflow.ru/hub/'], ['Проекты', '#cases'], ['Контакты', '#contacts'],\n    ];\n    const na
